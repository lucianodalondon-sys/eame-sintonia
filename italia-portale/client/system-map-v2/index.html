<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SINTONIA · O mapa da máquina (V2 · candidato)</title>
<link rel="stylesheet" href="../_ds/adama-brandwell/tokens/colors.css">
<link rel="stylesheet" href="../_ds/adama-brandwell/tokens/typography.css">
<link rel="stylesheet" href="map.css">
</head>
<body>

<!-- ══════════════════════════════════════════════════════════════════════════
     NADA NESTE FICHEIRO ESTÁ ESCRITO À MÃO sobre a máquina. Nenhum nome de
     peça, nenhum estado, nenhuma seta, nenhuma contagem. Tudo chega de
     `estado.gerado.json`, que o gerador produz do modelo canónico mais a
     medição do repositório.

         O SYSTEM MAP OBSERVA A MÁQUINA. NÃO A DEFINE.
     ══════════════════════════════════════════════════════════════════════════ -->

<header class="top">
  <div class="mark"></div>
  <div>
    <div class="ttl">SINTONIA</div>
    <div class="sub">O mapa da máquina · de longe o processo, de perto a engenharia</div>
  </div>
  <div class="find">
    <input id="q" placeholder="Procurar departamento, peça ou ficheiro…" autocomplete="off"
           aria-label="Procurar no mapa">
  </div>
  <div class="stamp" id="stamp"></div>
</header>

<div class="candidato" id="candidato"></div>

<nav class="crumbs" id="crumbs" aria-label="Onde estou">
  <div class="ctrls">
    <button class="ctrl" id="btProblemas" aria-pressed="false">⚠ Só os problemas</button>
    <button class="ctrl" id="btLegado" aria-pressed="false">Mostrar legado</button>
    <button class="ctrl" id="btMenos" aria-label="Afastar">−</button>
    <span class="zoomv" id="zoomv">100%</span>
    <button class="ctrl" id="btMais" aria-label="Aproximar">+</button>
    <button class="ctrl" id="btReset">Enquadrar</button>
  </div>
</nav>

<main class="stage" id="stage">
  <div class="mundo" id="mundo">
    <svg class="wires" id="wires" aria-hidden="true"></svg>
    <div id="view"></div>
  </div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Detalhe">
  <button class="dclose" id="dclose" aria-label="Fechar">×</button>
  <div class="dhead" id="dhead"></div>
  <div class="dbody" id="dbody"></div>
</aside>

<script src="map.js"></script>
</body>
</html>
