<meta name="description" content="Sintonia · ADAMA Italia — intelligence agricola. Ambiente dimostrativo.">
<!-- ══ QUESTA PAGINA NON E PIU UNO SCHERMO ═══════════════════════════════════
     Qui c'era una schermata intera: il marchio, il nome, la riga della marca e
     un pulsante «ENTRA NELLA DEMO». Poi `accesso.html` mostrava di nuovo il
     marchio, di nuovo il nome, di nuovo la riga della marca e di nuovo lo
     stesso pulsante. Il `meta refresh` a zero secondi non toglieva la prima:
     la faceva LAMPEGGIARE.

         DUE PORTE UGUALI, UNA DIETRO L'ALTRA, NON SONO UN INGRESSO.
         SONO UN'ESITAZIONE.

     Il rimando adesso sta nella TESTA del documento e usa `replace`, non
     `href`: parte prima che il corpo venga dipinto — quindi non c'e lampo — e
     non lascia una tappa nella cronologia, quindi il «indietro» del browser
     dalla pagina d'accesso esce dal sito invece di rimbalzare qui dentro.

     IL FILE RESTA, e non per abitudine: `deploy-surface.mjs` esige `/index.html`
     fra le rotte pubbliche e lo `build` di package.json ne verifica l'esistenza
     prima di ogni deploy. Una decisione di aspetto non toglie una rotta. -->
<script>location.replace('accesso.html');</script>
<meta http-equiv="refresh" content="0; url=accesso.html">
<style>
  html,body{margin:0;height:100%;background:#0E0C0B;color:#fff;font-family:system-ui,sans-serif}
  main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
  .mark{width:64px;height:64px;border-radius:15px;background:#009845;display:flex;align-items:center;justify-content:center}
  b{font-size:21px;font-weight:700;letter-spacing:0.16em}
  span{font-size:9.5px;font-weight:700;letter-spacing:0.20em;color:#8F8886}
  a{color:#00B152;text-decoration:none;font-size:12px;font-weight:700;letter-spacing:0.10em;
    padding:11px 24px;border-radius:9999px;background:#00783F;color:#fff;margin-top:8px}
  a:hover{background:#009845}
</style>
</head>
<body>
<!-- SENZA SCRIPT E SENZA REFRESH RESTA UNA PORTA, non una pagina bianca: chi
     arriva qui con tutto disattivato deve comunque poter entrare. -->
<noscript>
<main>
  <span class="mark" aria-hidden="true">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 12 4l8 16"></path><path d="M7.6 13.6h8.8"></path></svg>
  </span>
  <b>SINTONIA</b>

  <a href="accesso.html">ENTRA NELLA DEMO</a>
