# ═══════════════════════════════════════════════════════════════════════════
# SECURITY CHECK — esta mudanca piorou a seguranca?
#
# Nao pergunta se o sistema esta perfeito. Se perguntasse, estaria vermelho
# desde o primeiro dia e ninguem voltaria a olhar para ele.
#
#     A VALIDATOR THAT NOBODY RUNS IS NOT A SECURITY GATE.
#     UM PORTAO QUE NAO CORRE NAO E UM PORTAO.
#
# INDEPENDENTE de proposito. Nao partilha job com o Collection Gate nem com o
# System Map: quando dois portoes partilham resultado, o vermelho de um esconde
# o verde do outro, e ninguem sabe qual dos dois reprovou.
#
# RAPIDO de proposito. Corre em cada push, e por isso e inteiramente offline e
# deterministico: le ficheiros, nao fala com base de dados nem com a rede. A
# medicao da base viva e um workflow separado, com a sua propria cadencia.
#
#     FAST CHECK EM CADA COMMIT. DEEP CHECK NA SUA HORA.
#
# CADA PASSO RESPONDE A UMA PERGUNTA. Um unico `security = red` obrigaria
# alguem a abrir o log para descobrir o que aconteceu; passos separados dizem-no
# no nome. E `if: '!cancelled()'` garante que a falha do primeiro nao esconde o
# diagnostico dos outros — mas NAO corre quando a execucao foi cancelada, que e
# o que `always()` faria de errado.
# ═══════════════════════════════════════════════════════════════════════════
name: SECURITY CHECK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # a guarda de credencial pergunta o que ESTA rastreado

      - name: "1 · o baseline de seguranca e coerente consigo mesmo"
        # Um mapeamento que aponta para um controlo inexistente e uma norma sem
        # dono, e degrada em silencio.
        if: '!cancelled()'
        run: python3 security/validate-baseline.py

      - name: "2 · a arvore versionada continua sem credencial"
        # Dono unico desta pergunta: guarda/social_guarda.py. O SECURITY CHECK
        # chama-o, nao o reescreve.  ONE CONCEPT -> ONE OWNER.
        if: '!cancelled()'
        run: python3 guarda/social_guarda.py

      - name: "3 · as formas de credencial continuam a ser reconhecidas"
        # SECURITY TOOL EXISTS != SECURITY CONTROL WORKS.
        if: '!cancelled()'
        run: python3 -m unittest tests.test_security_secret_shapes -v

      - name: "4 · o segredo nao vaza em tempo de execucao"
        # SECRET NOT IN GIT != SECRET CANNOT LEAK AT RUNTIME. Duas perguntas,
        # duas provas. Esta e do SCRAP, e e consumida, nao copiada.
        if: '!cancelled()'
        run: python3 -m unittest tests.test_youtube_antidrift.AntiDrift.test_10_nenhum_segredo_no_veredito_do_preflight -v

      - name: "5 · o ratchet: nenhuma exposicao NOVA"
        # Divida herdada fica visivel e nao bloqueia. Regressao nova bloqueia,
        # e o erro diz o ficheiro e o campo — nunca o valor.
        if: '!cancelled()'
        run: python3 security/ratchet.py

      - name: "6a · o monitor de deriva classifica bem (sem tocar na base)"
        # Censos sinteticos, nenhuma ligacao. A prova que interessa e a de que
        # uma deriva SEGURA continua a ser reportada como deriva.
        if: '!cancelled()'
        run: python3 -m unittest tests.test_security_drift_db -v

      - name: "6 · o proprio ratchet ainda morde"
        # Um portao que nunca foi atacado nao se sabe se morde. Estas provas
        # montam um repositorio minimo e tentam passar-lhe uma exposicao a frente.
        if: '!cancelled()'
        run: python3 -m unittest tests.test_security_ratchet -v

      - name: "7 · a fronteira publicada continua a ser o que dizemos que e"
        # BUILD INPUT != PUBLIC OUTPUT. Imprime a superficie calculada para que
        # o log guarde a evidencia do dia sem guardar o conteudo dela.
        if: '!cancelled()'
        run: |
          python3 security/superficie_publica.py --json > /tmp/superficie.json
          python3 -c "
          import json; s = json.load(open('/tmp/superficie.json'))
          print('SUPERFICIE_PUBLICA_FICHEIROS=%d' % s['total_ficheiros'])
          print('SUPERFICIE_PUBLICA_BYTES=%d' % s['total_bytes'])
          print('OUTPUT_DIRECTORY=%s' % s['output_directory'])
          "
