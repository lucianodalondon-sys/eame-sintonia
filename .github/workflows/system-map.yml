# ═══════════════════════════════════════════════════════════════════════
# SYSTEM MAP CHECK — os dentes da lei escrita em AGENTS.md.
#
# `AGENTS.md` manda manter o mapa sincronizado com o repositório. Sem este
# workflow, essa frase seria um pedido por favor: qualquer agente poderia
# alterar a arquitetura, não regerar o mapa, e a mudança entrava na mesma.
#
#     TEXTO NÃO REPROVA NADA. WORKFLOW REPROVA.
#
# O que acontece aqui, em cada push e em cada pull request:
#
#   1. regera o mapa a partir da árvore que está a ser proposta;
#   2. compara com o que foi commitado — se diferir, ALGUÉM MEXEU NA
#      ARQUITETURA E NÃO ATUALIZOU O MAPA, e a mudança para aqui;
#   3. corre as provas das regras do mapa (verde sem evidência, aresta
#      inventada, NÃO SEI escondido);
#   4. prova que o pacote publicável foi regerado junto.
#
# Corre em `ubuntu-latest`, e não no runner local, porque não toca em rede,
# não gasta execução paga e não precisa de IP residencial: é leitura da
# própria árvore. As coletas é que precisam do runner local.
#
# O DEPLOY NÃO ESTÁ AQUI, DE PROPÓSITO
# ------------------------------------
# A publicação continua a ser da Vercel, ligada ao Git, servindo
# `italia-portale/client` (ver `vercel.json`). O mapa sai em `/system-map/`
# porque o gerador escreve a app lá dentro. Criar aqui um segundo caminho de
# deploy seria criar infraestrutura paralela para o mesmo destino — e dois
# publicadores para um endereço é a forma mais barata de servir a versão
# errada sem ninguém perceber.
# ═══════════════════════════════════════════════════════════════════════
name: system-map

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # O scanner lê `git ls-files` e o SHA de cada blob. Profundidade 1
          # basta: ele mede a ÁRVORE, não o histórico.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Sem dependências. O scanner usa só a biblioteca padrão, de propósito:
      # um mapa de arquitetura que depende de pacote de terceiro para ser
      # gerado tem uma dependência que o próprio mapa não consegue explicar.
      # ⚠️ SEM `pdftotext`, VARIOS PASSOS ABAIXO PASSAM SEM MEDIR.
      # Medido nesta arvore, com a ferramenta retirada do PATH:
      #   tests/test_preservar_derivado.py  -> OK (skipped=2)
      #   provas/o_executor_conta_se.py     -> PASS, saida byte a byte igual
      # Os casos de PDF ficavam permanentemente pulados neste workflow — o que
      # corre em TODO push — e um pulo silencioso tem a cor do verde.
      # Instalar custa segundos; nao instalar custa a confianca nos passos.
      - name: 0 · a ferramenta de texto existe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          pdftotext -v

      - name: 1 · regerar o mapa a partir desta árvore
        run: |
          python3 system-map/scripts/scan_repo.py
          python3 system-map/scripts/scan_sources.py
          python3 system-map/scripts/scan_casco.py
          python3 system-map/scripts/censo_da_coleta.py
          python3 system-map/scripts/pente_fino_da_coleta.py
          # ⚠️ OS OUTROS ONZE CENSOS NAO CORRIAM AQUI, E O MAPA MOSTRA-OS.
          # Medido em 2026-09-09: de 21 scripts do mapa, o CI corria SEIS. Os
          # `.generated.json` dos outros alimentam cartoes — o do derivado, o
          # dos donos, o do armazem italiano — e ninguem os regerava. Correr os
          # doze deu diferenca em SETE:
          #
          #   corpus-it       276 linhas · donos  78 · semantica-it  48
          #   recall-porta-it  30 · executores 6 · congelamento 2 · derivacoes 2
          #
          # E o P1_SEM_DRIFT nao apanhava, porque ele so regera o que o CI
          # regera: a verificacao anti-drift media exactamente a metade que
          # nao estava a apodrecer.
          #
          #     UM CENSO QUE NAO CORRE NAO E UM CENSO. E UMA FOTOGRAFIA.
          # ⚠️ A ORDEM AQUI E UMA DEPENDENCIA, NAO ARRUMACAO.
          # `relatorio_do_fluxo.py` ESCREVE `fluxo.generated.json` (linha 44,
          # json.dump na 172) e `censo_da_observabilidade.py` LE-O nas linhas
          # 54, 81 e 114 para decidir as dimensoes TRACE e PERFORMANCE.
          # Ao ligar os onze censos, liguei o CONSUMIDOR e deixei o PRODUTOR
          # de fora — o censo passaria a correr sempre sobre um ficheiro que
          # ninguem refazia.
          #
          #     LIGAR QUEM LE E DEIXAR QUEM ESCREVE DE FORA
          #     E TROCAR UM FICHEIRO PARADO POR UM NUMERO CONFIANTE.
          python3 system-map/scripts/relatorio_do_fluxo.py
          python3 system-map/scripts/censo_da_observabilidade.py
          python3 system-map/scripts/censo_das_derivacoes.py
          python3 system-map/scripts/censo_das_estradas_it.py
          python3 system-map/scripts/censo_de_identidade_it.py
          python3 system-map/scripts/censo_do_armazem_it.py
          python3 system-map/scripts/censo_do_congelamento.py
          python3 system-map/scripts/censo_do_corpus_it.py
          python3 system-map/scripts/censo_dos_donos.py
          python3 system-map/scripts/censo_dos_executores.py
          python3 system-map/scripts/censo_semantico_it.py
          python3 system-map/scripts/recall_da_porta_it.py
          python3 system-map/scripts/generate_system_map.py

      # O censo da topologia: quem chama cada cartao, o que atravessa cada
      # aresta, e porque um cartao esta sozinho. Corre depois do mapa porque
      # le o estado gerado.
      - name: 1b · o censo da topologia da coleta
        run: python3 system-map/scripts/censo_da_topologia.py

      # A comparacao anti-drift NAO e um `git diff` cru, de proposito: o bloco
      # PROVENANCE carrega HEAD e BRANCH, que mudam a cada commit e a cada ramo.
      # Um diff cru reprovaria toda a gente, sempre — inclusive o commit que
      # acabou de regerar o mapa. O validador compara a ARQUITETURA, ignorando
      # o carimbo, e cobre tambem a copia que vai ser servida.
      - name: 2 · o validador (provas anti-drift, falha fechado)
        run: python3 system-map/scripts/validate_system_map.py

      - name: 3 · o padrão do departamento de coleta não piorou
        run: python3 medidas/padrao_da_coleta.py

      - name: 4 · as regras do mapa não afrouxaram
        run: python3 system-map/tests/test_system_map.py

      # As sete maneiras conhecidas de o caminho da coleta mentir. Sem isto no
      # CI, «erro não é rejeição» e «não sei não é não» seriam boas intenções
      # escritas num comentário — e voltariam a confundir-se na primeira pressa.
      - name: 4b · o caminho da coleta continua fechado
        run: python3 provas/testa_coleta_canonica.py

      # A Bíblia da coleta declara 48 leis, e `docs/biblia/leis.json` é DERIVADO
      # do texto dela — nunca escrito à mão. Sem este passo, as duas podiam
      # divergir em silêncio, e a partir daí nenhuma das duas valeria.
      - name: 4c · a Bíblia da coleta e o seu registo dizem a mesma coisa
        run: python3 provas/valida_biblia.py

      # A lei confrontada com a estrada real: ocorrencia x conteudo, derivados
      # com pai, e a prova de que repeticao de conteudo nunca entra como perda.
      - name: 4d · a Biblia e a primeira estrada continuam a dizer o mesmo
        run: |
          python3 tests/test_biblia.py
          python3 tests/test_integracao_biblia.py
          python3 tests/test_observabilidade_estrada.py
          python3 tests/test_red_team_estrada.py

      # CAMINHO nao e CAPTURA, e SHA igual nao prova a mesma captura. Este passo
      # tambem RE-CORRE o censo de identidade e compara-o com o ficheiro
      # comitado: se alguem editar o gerado a mao, o CI apanha.
      - name: 4e · as quatro espécies do artefato não voltam a confundir-se
        run: python3 tests/test_identidade_do_artefato.py

      # BYTES PRESENTES != PROVENIENCIA OPERACIONAL COMPLETA. Sem este passo, os
      # 195 objetos italianos guardados sem dono voltariam a parecer saude — e a
      # leitura do coordenador podia virar OBSERVED sem ninguem reparar.
      - name: 4f · o armazém italiano não se pinta de saudável
        run: python3 tests/test_armazem_italiano.py

      # A GARANTIA FORWARD do G-42. Envio que passa com memoria que falha NAO
      # pode dar COMPLETE, e o byte preservado nao se apaga para fingir
      # atomicidade. Sem este passo, o estado italiano podia voltar calado.
      - name: 4g · coleta nova não produz armazém sem memória
        run: python3 tests/test_preservar_coleta.py

      # SQL ACEITE NAO E LINHA GRAVADA. Aqui a reconciliacao vem de um SELECT
      # num banco de verdade e descartavel — e a corrida so diz COMPLETE se o
      # banco tambem disser `concluida`. O mesmo contra Postgres 16 real corre
      # no workflow `banco-descartavel.yml`.
      - name: 4h · a reconciliação é lida de um banco, não presumida
        run: python3 tests/test_preservar_coleta_no_banco.py

      # ON CONFLICT DO NOTHING NAO E IDEMPOTENCIA. Sem este passo, uma derivacao
      # que passasse a produzir outro resultado entraria como REUSED — e o
      # sistema ficaria calado no dia em que devia gritar.
      - name: 4i · a mesma receita com outro resultado grita
        run: python3 tests/test_preservar_derivado.py

      # MISSAO ONE-SHOT TERMINOU -> PORTA ONE-SHOT E FECHADA. E migration
      # aplicada e artefato imutavel: versao igual com SHA diferente e drift.
      - name: 4j · a porta de produção continua lacrada
        run: python3 tests/test_porta_de_producao.py

      # ═══════════════════════════════════════════════════════════════
      # AS PROVAS DA COLETA QUE NAO PRECISAM DE BANCO — e que ninguem corria.
      #
      #     UM PORTAO QUE NAO CORRE NAO E UM PORTAO.
      #
      # Medido: `grep -rl <nome> .github/workflows/ motor/` devolvia vazio
      # para as quatro. Nao eram codigo morto — eram GATES DESLIGADOS, que e
      # outra coisa e mais perigosa: parecem cobertura e nao cobrem nada.
      #
      # A prova disto e o que se encontrou ao liga-las: `fluxo_no_seco`
      # estava VERMELHA, com dois defeitos reais e antigos la dentro.
      - name: 4k · a lingua e a mesma no contrato, no storage e no scanner
        run: python3 provas/paridade_da_lingua.py

      - name: 4l · a telemetria distingue NAO CORREU de FALHOU, e a conta fecha
        run: python3 provas/fluxo_no_seco.py

      - name: 4m · as trinta armadilhas do caminho do PDF continuam vazias
        run: python3 provas/testa_golden_path_pdf.py

      - name: 4n · o mapa nao diz que nao existe o que existe
        run: python3 provas/o_mapa_nao_mente.py

      # Sem banco: le migrations e codigo, e confronta cada `on conflict` com
      # a chave unica que o sustenta. Corre tambem em `banco-descartavel.yml`,
      # que so acorda por caminho; aqui acorda em todo o push.
      - name: 4o · toda clausula `on conflict` tem chave que a sustente
        run: python3 provas/o_dedupe_tem_constraint.py

      # A fronteira entre a coleta e a inteligencia: que a lei e o codigo
      # continuem a declarar o MESMO contrato, e que ele tenha um dono so.
      # Ela NAO falha por nao haver consumidor — isso e um buraco declarado,
      # e o trabalho dela e medi-lo, nao pinta-lo de verde.
      # Ele RECUSA-SE a correr sem `pdftotext` — antes passava sem a
      # ferramenta, medindo os derivados ja em arvore como REUSED e chamando
      # a isso «um executor REAL». Com o passo 0 acima, a recusa nunca chega
      # a ser precisa aqui, e e essa a intencao.
      - name: 4p · o executor conta-se, e a lingua que ele fala e a comum
        run: python3 provas/o_executor_conta_se.py

      - name: 4q · a fronteira tem um contrato, um dono, e a lei bate com o codigo
        run: python3 provas/a_fronteira_da_coleta.py

      - name: 5 · o que vai ser publicado existe e é servível
        run: |
          set -e
          for f in index.html map.js map.css state.generated.json; do
            test -s "italia-portale/client/system-map/$f" \
              || { echo "::error::falta italia-portale/client/system-map/$f"; exit 1; }
          done
          # A app carrega os tokens oficiais em `../_ds/`. Se esse caminho não
          # existir no que é servido, a página publica sai sem a marca ADAMA —
          # e uma página que perde o Design System em silêncio é pior do que
          # uma que não abre.
          test -f italia-portale/client/_ds/adama-brandwell/tokens/colors.css \
            || { echo "::error::o Design System não está no caminho servido"; exit 1; }
          python3 - <<'PY'
          import json
          s = json.load(open('italia-portale/client/system-map/state.generated.json',
                             encoding='utf-8'))
          c = s['COUNTS']
          print(f"PUBLICAVEL=YES · HEAD={s['PROVENANCE']['HEAD'][:10]} · peças={c['components']} "
                f"(P{c['components_proven']} p{c['components_pending']} "
                f"B{c['components_broken']} U{c['components_unknown']}) "
                f"· ligações={c['edges']} · cobertura={c['files_covered']}/{c['files_tracked']}")
          PY

      - name: 6 · nenhum segredo atravessa para o que é publicado
        run: |
          # O repositório é público e o mapa é servido. Ele carrega caminho de
          # ficheiro e trecho de linha — e trecho de linha é exatamente onde um
          # segredo se esconderia sem ninguém reparar.
          if grep -rIEn '(APIFY_TOKEN|SUPABASE_[A-Z_]*KEY|SERVICE_ROLE|BEGIN [A-Z ]*PRIVATE KEY)[^A-Z_]*[:=][[:space:]]*['"'"'"][A-Za-z0-9_-]{16,}' \
               italia-portale/client/system-map/ ; then
            echo "::error::possível segredo no que vai ser publicado"; exit 1
          fi
          echo "SEM_SEGREDO=YES"
