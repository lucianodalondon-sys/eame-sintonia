# ═══════════════════════════════════════════════════════════════════════
# SINTONIA SCRAP — o executor composto social. Uma fase por execução.
#
# Este workflow NÃO é um segundo motor. O `apify-sensores.yml` continua sendo a
# estrada paga desta casa, com o pool de chaves e o `coletor.executar()`. Aqui
# entram as rotas GRATUITAS E PERMITIDAS, que não tocam a Apify e não precisam
# do runner com GPU.
#
#     censo    GRÁTIS · a matriz de capacidade por plataforma
#     portao   GRÁTIS · o robots.txt vivo permite esta URL?
#     video    GRÁTIS · de onde sai vídeo italiano hoje
#     gap      GRÁTIS · onde a Apify ainda é necessária, e com que motivo
#     piloto   GRÁTIS · a prova pequena, ao vivo, contra alvo real
#     ledger   GRÁTIS · o que REALMENTE rodou (can do != did do)
#
# TODAS as fases custam zero DÓLAR. A partir de 2026-09-08 uma delas custa QUOTA:
# `youtube` fala com a YouTube Data API v3 pela chave `YOUTUBE_DATA_API_KEY`.
#
# Este arquivo dizia, até agora, "não há secret aqui de propósito: no dia em que a
# chave existir, ela entra como secret e a fase que a usa passa a existir". Esse
# dia chegou, e é só isto que mudou: o secret entrou e a fase apareceu.
#
# O SECRET NÃO SAI DAQUI
# -----------------------
# `YOUTUBE_DATA_API_KEY` entra por `secrets`, vive só no ambiente do passo, e a
# chamada a monta na query string em memória. Ela NÃO entra em RAW, manifesto,
# mapa nem mensagem de erro: `social_sessao.redigir()` reconhece a forma `AIza…`
# e apaga o valor antes de qualquer texto virar registro.
#
# QUOTA NÃO É DINHEIRO, E TAMBÉM NÃO É INFINITA
# ----------------------------------------------
# A fase gasta de dois baldes SEPARADOS — 100 chamadas de busca por dia e 10.000
# unidades para o resto — e os tetos POR EXECUÇÃO são menores de propósito, para
# que uma rodada não coma o dia. US$ 0,00 não quer dizer "à vontade".
#
# POR QUE RODA NO RUNNER HOSPEDADO, E NÃO NO LOCAL
# --------------------------------------------------
# O piloto de 2026-09-08 mediu que este IP de datacenter é barrado pelo Bluesky
# `searchPosts` e pelo player do YouTube. Isso é informação, não defeito: a
# saúde de rota é uma propriedade do HOST, e medi-la nos dois lugares é como
# se descobre que "a rota caiu" e "a rota caiu AQUI" são frases diferentes.
# ═══════════════════════════════════════════════════════════════════════
name: scrap-social

on:
  workflow_dispatch:
    inputs:
      fase:
        description: 'qual fase rodar'
        required: true
        default: censo
        type: choice
        options: [censo, portao, video, gap, piloto, ledger, sessao, politica, guarda,
                  youtube, youtube-piloto, youtube-piloto-oneshot]
      url:
        description: 'só para a fase `portao`: a URL a testar'
        required: false
        default: 'https://www.youtube.com/feeds/videos.xml?channel_id=X'
      auth_mode:
        description: 'AUTO deixa a política escolher. Os outros FORÇAM e podem recusar.'
        required: false
        default: AUTO
        type: choice
        # Não existe `force_apify`, e a ausência é a decisão: o caller não
        # escolhe ferramenta. Ele diz o que quer; a rota é decisão da casa.
        options: [AUTO, PUBLIC, OFFICIAL_API, LOCAL_SESSION]

permissions:
  contents: write

jobs:
  scrap:
    # A fase que fala com o navegador PRECISA da máquina onde o perfil vive. As
    # outras não — e mandar tudo para o runner local só ocuparia a máquina que
    # faz a coleta paga.
    #
    #     O GITHUB DISPARA. O PC EXECUTA. A SESSÃO NÃO VIAJA.
    runs-on: ${{ (inputs.fase == 'sessao' || inputs.auth_mode == 'LOCAL_SESSION')
      && fromJSON('["self-hosted","Windows","X64","eame-sintonia-local"]')
      || fromJSON('"ubuntu-latest"') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        if: inputs.fase != 'sessao' && inputs.auth_mode != 'LOCAL_SESSION'
        with:
          python-version: '3.11'

      # ── A REF ESCOLHIDA TEM O CÓDIGO DESTA MISSÃO? ────────────────────────
      # Este arquivo passa a existir na `main` para que o `workflow_dispatch`
      # funcione — mas o código do SCRAP NÃO foi promovido junto, de propósito.
      # Quem escolher `main` por engano encontraria o workflow e não o executor.
      #
      #     REGISTRAR UM WORKFLOW NA MAIN
      #     NÃO É PROMOVER TODO O SCRAP PARA MAIN.
      #
      # A trava é pela PRESENÇA do código, nunca pelo nome da branch: no dia em
      # que o SCRAP chegar à main, ela passa a deixar a main rodar sozinha.
      - name: 0a · a ref escolhida tem o executor?
        run: |
          FALTA=""
          for f in coleta/social_scrap.py guarda/social_guarda.py \
                   coleta/youtube_oficial.py; do
            [ -f "$f" ] || FALTA="$FALTA $f"
          done
          if [ -n "$FALTA" ]; then
            echo "SCRAP_CODE_NOT_PRESENT_ON_SELECTED_REF"
            echo "ref=${{ github.ref_name }} · falta:$FALTA"
            echo "Escolha a ref que contem o executor do SCRAP."
            exit 1
          fi
          echo "SCRAP_CODE_PRESENT=YES · ref=${{ github.ref_name }}"

      # A GUARDA RODA ANTES DE TUDO. Se um cookie ou um perfil de navegador
      # entrou no repositório, nada mais desta execução importa — e descobrir
      # depois do push é tarde: segredo commitado fica no pack para sempre.
      - name: 0 · nenhum segredo entrou no repositório
        run: |
          PYTHONIOENCODING=utf-8 python3 guarda/social_guarda.py \
            || PYTHONIOENCODING=utf-8 py guarda/social_guarda.py

      - name: 1 · rodar a fase
        env:
          # O caminho do perfil vem da MÁQUINA, nunca do repositório. Se não
          # estiver definido, `navegador.py` usa ~/.sintonia-browser.
          SINTONIA_BROWSER_PROFILE_DIR: ${{ vars.SINTONIA_BROWSER_PROFILE_DIR }}
          SINTONIA_AUTH_MODE: ${{ inputs.auth_mode }}
          # A chave da API. Ausente, a fase `youtube` para em CREDENTIAL_MISSING e
          # NÃO cai para scraping — a recusa é o resultado correto, não um erro.
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          # Tetos POR EXECUÇÃO, separados por balde. Não são o limite do projeto.
          YT_TETO_SEARCH_CALLS: ${{ vars.YT_TETO_SEARCH_CALLS || '2' }}
          YT_TETO_GENERAL_UNITS: ${{ vars.YT_TETO_GENERAL_UNITS || '200' }}
          # O DONO DA DURABILIDADE precisa de DSN. É o MESMO secret que
          # `supabase-conexao.yml` já usa — nome novo seria um segundo cofre para
          # a mesma chave, e dois cofres divergem. Ausente, a fase `youtube-piloto`
          # para em CHECKPOINT_CANONICAL_UNAVAILABLE e NÃO cai para JSON nem Git.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "FASE=${{ inputs.fase }}"
          PYTHONIOENCODING=utf-8 python3 coleta/social_scrap.py \
            "${{ inputs.fase }}" ${{ inputs.fase == 'portao' && inputs.url || '' }}

      # A PROVA BRUTA DO PILOTO SOBE COMO ARTEFATO, NÃO COMO COMMIT
      # ------------------------------------------------------------
      # O disco do runner morre no fim do job, e um `RAW_REFERENCE` apontando
      # para lá seria promessa que ninguém cumpre. Mas RAW recorrente também não
      # entra no Git: seria histórico infinito, contra P-011.
      #
      #     PILOT_PROOF NÃO É OPERATIONAL_STORAGE.
      #
      # O artefato do Actions é a casa certa para uma prova de UMA execução: tem
      # retenção declarada, não pesa no clone de ninguém, e o manifesto que VAI
      # ao Git carrega o hash de cada arquivo — com ele a prova é reconciliável
      # mesmo depois de o artefato expirar.
      # Quantos bytes de prova a corrida produziu? Medido ANTES do upload, para
      # que "não houve RAW" nunca se confunda com "o upload falhou".
      - name: 2 · quanto RAW o piloto produziu
        if: inputs.fase == 'youtube-piloto-oneshot' || inputs.fase == 'youtube-piloto'
        id: rawcount
        run: |
          D=data/samples/SOCIAL-IT/raw-free
          N=$(find "$D" -type f 2>/dev/null | wc -l)
          B=$(find "$D" -type f -printf '%s\n' 2>/dev/null | awk '{t+=$1} END {print t+0}')
          echo "count=$N" >> "$GITHUB_OUTPUT"
          echo "bytes=$B" >> "$GITHUB_OUTPUT"
          echo "RAW_FILE_COUNT=$N · RAW_TOTAL_BYTES=$B"

      # `if-no-files-found: error` porque, quando houve RAW, um upload que não
      # sobe nada é FALHA — não aviso. E `continue-on-error` para que perder o
      # artefato não apague a medição da API, que continua valendo.
      - name: 3 · a prova bruta do piloto (PILOT_PROOF)
        if: (inputs.fase == 'youtube-piloto-oneshot' || inputs.fase == 'youtube-piloto')
          && steps.rawcount.outputs.count != '0'
        id: raw
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: youtube-piloto-raw-${{ github.run_id }}
          path: data/samples/SOCIAL-IT/raw-free/
          if-no-files-found: error
          retention-days: 30

      # ── O ESTADO DA PROVA, DECIDIDO POR TRÊS MEDIDAS ──────────────────────
      #
      #     UPLOAD STEP SUCCESS ≠ ARTIFACT EXISTS.
      #
      # Antes, `if-no-files-found: warn` deixava o passo VERDE com zero arquivos,
      # e o estado virava PILOT_PROOF sem prova nenhuma. Agora só é completo com
      # arquivo, upload verde E `artifact-id` devolvido pelo Actions.
      - name: 4 · o estado da prova, e o relatório o carrega
        if: always() && (inputs.fase == 'youtube-piloto-oneshot' || inputs.fase == 'youtube-piloto')
        env:
          SCRAP_ARTIFACT_OUTCOME: ${{ steps.raw.outcome }}
          SCRAP_ARTIFACT_ID: ${{ steps.raw.outputs.artifact-id }}
          SCRAP_ARTIFACT_NAME: youtube-piloto-raw-${{ github.run_id }}
        run: |
          N='${{ steps.rawcount.outputs.count }}'
          if [ "${N:-0}" = "0" ]; then
            echo "RAW_PROOF_STATE=NO_RAW_PRODUCED"
          elif [ "$SCRAP_ARTIFACT_OUTCOME" = "success" ] && [ -n "$SCRAP_ARTIFACT_ID" ]; then
            echo "RAW_PROOF_STATE=PILOT_PROOF_ACTIONS_ARTIFACT"
            echo "ARTIFACT_ID=$SCRAP_ARTIFACT_ID"
          else
            echo "RAW_PROOF_STATE=PARTIAL_PROOF (outcome=$SCRAP_ARTIFACT_OUTCOME, id=${SCRAP_ARTIFACT_ID:-VAZIO})"
          fi
          # O relatório é reescrito com o estado REAL da prova — o script sozinho
          # não podia saber se o artefato subiu.
          PYTHONIOENCODING=utf-8 python3 - <<'PYEOF'
          import json, os, sys
          sys.path.insert(0, '.')
          import _gavetas  # noqa: F401
          import social_envelope as env
          import social_scrap as sc
          rel = env.ler('YOUTUBE-PILOTO-IT.json')
          if rel:
              rel.update(sc._raw_do_piloto(rel.get('RUN_ID') or 'DESCONHECIDO'))
              env.gravar('YOUTUBE-PILOTO-IT.json', rel)
              print('RAW_PROOF_STATE gravado:', rel['RAW_PROOF_STATE'])
          PYEOF

      # ARTEFATO DE PROVA, NUNCA MEMÓRIA OPERACIONAL
      # --------------------------------------------
      # A versão anterior fazia `git add -A data/samples/SOCIAL-IT`, e junto com a
      # amostra levava `YOUTUBE-CHECKPOINT.json` — o estado que decidia o que a
      # PRÓXIMA execução ia buscar. Isso fazia do Git a memória operacional da
      # coleta, contra `docs/operacao/P-011-DADO-OPERACIONAL-NO-GIT.md`.
      #
      #     GIT NÃO É BANCO OPERACIONAL.
      #
      # Agora entram ficheiros NOMEADOS, classificados como SAMPLE/PROOF. Nunca
      # `-A` numa pasta: `-A` leva o que alguém puser lá amanhã, e é assim que
      # checkpoint volta pelo lado. Checkpoint, run state e ledger operacional têm
      # dono próprio — `coleta/coleta_checkpoint.py` sobre `checkpoint_coleta`.
      - name: 5 · devolver a amostra de PROVA ao repositório
        if: inputs.fase == 'piloto' || inputs.fase == 'youtube-piloto'
          || inputs.fase == 'youtube-piloto-oneshot'
        run: |
          set -e
          git config user.name  "sintonia-eame-runner"
          git config user.email "runner@eame-sintonia.local"
          for f in data/samples/SOCIAL-IT/PILOTO-SOCIAL-IT.json \
                   data/samples/SOCIAL-IT/LEDGER-SOCIAL-IT.json \
                   data/samples/SOCIAL-IT/YOUTUBE-PILOTO-IT.json; do
            [ -f "$f" ] && git add "$f"
          done
          # Trava de execução: se um checkpoint aparecer no índice, a corrida para.
          # O teste `test_o_workflow_nao_commita_checkpoint` guarda o texto; esta
          # linha guarda o ato.
          if git diff --cached --name-only | grep -qi "CHECKPOINT"; then
            echo "RECUSADO: checkpoint no indice — GIT NAO E BANCO OPERACIONAL"; exit 1
          fi
          if git diff --cached --quiet; then
            echo "NADA_MUDOU=YES"; exit 0
          fi
          git diff --cached --stat
          git commit -q -m "scrap-social: amostra de prova do piloto (run ${{ github.run_id }})"
          for t in 1 2 3; do
            git fetch --quiet origin "${{ github.ref_name }}"
            if git rebase --quiet "origin/${{ github.ref_name }}"; then
              if git push --quiet origin HEAD:"${{ github.ref_name }}"; then
                echo "RESULTADO_COMMITADO=YES (tentativa $t)"; exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep $((t * 5))
          done
          echo "RESULTADO_COMMITADO=NO"; exit 1
