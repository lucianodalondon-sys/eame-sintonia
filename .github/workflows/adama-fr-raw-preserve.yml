name: adama-fr-raw-preserve

# Fecha o RAW frances: sobe os 234 objetos de data/raw/FR/ para o bucket, le o
# inventario, baixa cada um DE VOLTA e confere sha256 e bytes.
#
# NAO tem checkout, e isso e de proposito. Os RAW estao FORA do Git — data/raw e
# ignorado por politica do repositorio — e existem so em C:\eame-sintonia-fr,
# nesta maquina. Um runner GitHub-hosted nao enxerga um byte deles. Por isso o
# job exige a etiqueta do runner local dedicado, e prova onde esta antes de
# escrever qualquer coisa.
#
#     CHECKOUT != OS BYTES ESTAO AQUI
#     PRESENCE_IN_BUCKET != CONTENT_VERIFIED
#
# Os 234 sao 111 paginas de produto + 122 documentos distintos + 1 pacote E-Phy.
# O numero anterior (191) esta REVOGADO: ele vinha de um manifesto em que 53
# documentos tinham sido gravados por cima uns dos outros.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preservar:
    # As quatro etiquetas juntas: so o runner dedicado ao eame-sintonia atende.
    # Os outros dois runners desta maquina pertencem ao portal-sintonia.
    runs-on: [self-hosted, Windows, X64, eame-sintonia-local]
    timeout-minutes: 90
    steps:
      - name: provar a maquina, o worktree e a branch antes de tocar no Storage
        shell: powershell
        run: |
          "RUNNER_NAME = $env:RUNNER_NAME"
          $existe = Test-Path 'C:\eame-sintonia-fr'
          "WORKTREE_EXISTS = $existe"
          if (-not $existe) { "PARADO: este runner nao enxerga o acervo frances"; exit 1 }
          Set-Location 'C:\eame-sintonia-fr'
          $branch = (git rev-parse --abbrev-ref HEAD | Out-String).Trim()
          $head   = (git rev-parse HEAD | Out-String).Trim()
          $sujo   = (git status --porcelain | Measure-Object -Line).Lines
          "FR_BRANCH = $branch"
          "FR_HEAD = $head"
          "ALTERACOES_NAO_COMMITADAS = $sujo"
          if ($branch -ne 'claude/adama-fr-local-catalog') { "PARADO: branch errada"; exit 1 }
          $n = (Get-ChildItem -Recurse -File 'data\raw\FR').Count
          "RAW_FILES_ON_DISK = $n"
          if ($n -lt 230) { "PARADO: acervo incompleto no disco"; exit 1 }
          "RUNNER_CAN_SEE_WORKTREE = TRUE"

      - name: canario de autenticacao — somente leitura, antes do primeiro byte
        shell: powershell
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Sem isto o Python escreve em cp1252 no Windows e MORRE no primeiro
          # acento que ele mesmo imprime — depois de ja ter subido arquivo, o que
          # deixaria o estado ambiguo. Medido nesta maquina.
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          Set-Location 'C:\eame-sintonia-fr'
          py scripts\runtime_python.py --exec scripts\adama_fr_raw.py --canario
          if ($LASTEXITCODE -ne 0) { "PARADO: canario reprovou. UPLOAD_ATTEMPTS = 0"; exit $LASTEXITCODE }

      - name: plano RAW medido do disco, sem rede
        shell: powershell
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          Set-Location 'C:\eame-sintonia-fr'
          py scripts\runtime_python.py --exec scripts\adama_fr_raw.py --plano

      - name: upload, inventario, download de volta, sha256 e bytes
        shell: powershell
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          Set-Location 'C:\eame-sintonia-fr'
          py scripts\runtime_python.py --exec scripts\adama_fr_raw.py --enviar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: veredito da fundacao francesa
        if: always()
        shell: powershell
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          Set-Location 'C:\eame-sintonia-fr'
          py scripts\runtime_python.py --exec scripts\adama_fr_fundacao.py
