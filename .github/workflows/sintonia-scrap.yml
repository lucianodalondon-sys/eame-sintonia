# ═══════════════════════════════════════════════════════════════════════
# SINTONIA SCRAP — a coleta de Instagram, despachável de qualquer lugar.
#
#     WORKFLOW    sintonia-scrap.yml          (este)
#     DATASET     data/samples/INSTAGRAM-JANELA/
#                 data/samples/INSTAGRAM-COLETA/
#                 data/samples/INSTAGRAM-DIARIO/
#                 data/samples/INSTAGRAM-TRANSCRICOES/
#     LOTE        COMPETITOR-PUBLIC-COMM/PUBLIC-COMM-FIRST-BATCH-EAME.json
#     NAMESPACE   commit limitado aos caminhos INSTAGRAM-*
#
# POR QUE ESTE ARQUIVO EXISTE
# -----------------------------
# Os cinco `instagram_*.py` foram construídos e medidos em 2026-09-02 e rodavam
# À MÃO, na máquina. Isso significa que a coleta só existia enquanto alguém
# estivesse sentado nela. Aqui ela vira despacho: quem pede não precisa estar
# na máquina, e o que rodou fica no histórico do repositório.
#
#     A MÁQUINA CONTINUA SENDO A MÁQUINA. O QUE MUDA É QUEM PODE CHAMAR.
#
# A transcrição é LOCAL e de propósito: `faster-whisper` nos 16 núcleos custa
# tempo de máquina, não fatura. A rota paga de transcrição cobra por minuto —
# e há ator que cobra por minuto INICIADO. Por isso ela roda no self-hosted, e
# não num runner da nuvem.
#
# A ORDEM É LEI, E ELA VEM DA MISSÃO 14
# ---------------------------------------
#     LOTE CONGELADO → PERFIL → OBJETO → (só então) ROTA PAGA
#
# As fases grátis não são cerimônia. `contratos` responde se o ator aceita os
# campos que vão ser mandados — 8 execuções desta casa já foram queimadas
# mandando campo que o Actor descartava em silêncio. `janela` responde o que a
# rota pública já entrega: bio, seguidores, os 12 posts recentes, a legenda
# inteira, a data, as curtidas e — em reel — as visualizações e a duração.
# Pagar por isso seria pagar duas vezes.
#
# CONCORRÊNCIA
# ------------
# O passo de devolução faz commit, e dois commits simultâneos na mesma branch é
# a colisão que já custou um rebase nesta casa. O grupo é nomeado pela missão:
# paralelismo ENTRE missões continua permitido.
# ═══════════════════════════════════════════════════════════════════════
name: sintonia-scrap

on:
  workflow_dispatch:
    inputs:
      # ── A FONTE DESCE COM O PEDIDO, E NAO SOBE DA OBSERVACAO ──────────
      # O SCRAP observa PLATAFORMAS; a porta da coleta fala em FONTES. Sem o
      # `SOURCE_ID` do atlas vindo daqui, o adapter declara ZERO colheita e
      # escreve porque — em vez de inventar uma fonte a partir da URL.
      #
      #     URL NAO E SOURCE_ID.
      #
      # Vazio e um valor legitimo: quer dizer «nao nomeei fonte», e a resposta
      # a isso e zero colheita, nao uma fonte adivinhada.
      fonte:
        description: 'SOURCE_ID do atlas (vazio = sem colheita, so suporte)'
        required: false
        default: ''
        type: string
      fase:
        description: 'qual fase rodar'
        required: true
        default: janela
        type: choice
        options:
          # ── GRÁTIS ─────────────────────────────────────────────────
          - contratos      # lê o INPUT SCHEMA de cada ator. Zero run.
          - italia-documento # UMA fonte italiana do Atlas, pela porta canonica, com banco descartavel
          - plano          # em que faixa está cada chave do pool
          - janela         # rota pública pelo navegador: perfis + objetos
          - janela-perfis  # só a camada de perfil
          - janela-objetos # só a camada de objeto
          # O CANÁRIO DA RELEASE V1. Rota gratuita, permitida, sem credencial,
          # sem navegador autenticado e sem fornecedor pago — escolhida para
          # provar a MÁQUINA, e não a plataforma mais importante.
          - canario-bluesky # cronologia pública de UMA conta Bluesky
          # A ÚNICA rota que a política permite no LinkedIn: lê o site DA
          # PRÓPRIA organização e traz de lá o endereço que ela publicou.
          # Devolve CATÁLOGO, e catálogo não atravessa a Admissão.
          - identidade-linkedin # o endereço LinkedIn publicado pela organização
          - video-linkedin # D23: o VÍDEO (e a legenda) das páginas públicas de ORGANIZAÇÃO
          # `transcrever` e `transcrever-alvos` foram APOSENTADAS na C10.4C.
          # A fala de Reel tem um dono só, e ele pede áudio — nunca o vídeo
          # inteiro. Ver `docs/sintonia-scrap/C10-4C-APOSENTAR-A-ROTA-LEGADA.md`.
          - diario         # a passada do dia sobre o muro de 12
          - diario-fila    # quem vence hoje, e por quê
          - diario-noticia # o que MUDOU desde ontem
          - semaforo       # a grade de cobertura
          - liquidar       # o custo REAL das fases pagas, depois
          - portao-pessoal # o portão de dado pessoal está aberto? por quê?
          # Lê o BRUTO já pago e diz que forma ele tem. Nenhuma rede, nenhum
          # provider, nenhum dólar — é `cat` sobre bytes que já são nossos.
          - yt-legenda-bruto # que forma tem o bruto que a corrida paga trouxe
          # ── PAGAS ──────────────────────────────────────────────────
          - bio            # teste de fumaça de ~1 centavo
          - posts          # um run por conta
          - reels          # um run por conta
          - comentarios    # atrás do portão de dado pessoal (GDPR)
          # A ÚNICA fase paga autorizada pela C10.8B-LIVE. Ela não recebe alvo,
          # teto nem motivo por aqui: tudo isso vive em `FASES_PAGAS`, dentro de
          # `coleta/social_scrap.py`, onde se lê num commit e não se escolhe num
          # formulário. Este workflow é DISPARADOR.
          - yt-legenda-paga  # 1 run · US$0,10 · 1 vídeo · a rota apify:transcricao
          # ── YOUTUBE · TODAS GRÁTIS ─────────────────────────────────
          - yt-canais      # nome, inscritos, descrição dos 8 canais
          - yt-objetos     # 30 vídeos por página, com continuation
          - yt-legendas    # a LEGENDA pública: transcrição sem whisper
          - yt-relevancia  # vale a pena a fonte? e quem vai ao whisper
          - yt-calibrar    # cobertura do léxico + candidatos a termo novo
          - yt-alvos       # o que a fila manda, sem transcrever
          - yt-transcrever # whisper local, SÓ no que a fila aprovou

          # ── AS CINCO OFICIAIS, PELA PORTA CANÓNICA ─────────────────
          # Elas existem em `scrap_colheita.FASES` e em `serve_fases` desde a
          # C10, com rota, adaptador, prova e `CHECK=CAN_COLLECT_NOW` — e NÃO
          # tinham ramo aqui. Sem ramo o caminho existia e ninguém o podia
          # disparar de CI:
          #
          #     CAPABILITY PROVEN != EDGE WIRED != COLLECTION REACHABLE
          #
          # As quatro primeiras falam com a YouTube Data API v3 e precisam de
          # `YOUTUBE_DATA_API_KEY`. `audio-youtube` NÃO precisa: a rota dela é
          # `yt-dlp` + `ffmpeg` na máquina, custo zero.
          - busca-youtube       # search.list — candidatos a partir de um termo (CATALOG)
          - canal-youtube       # playlistItems.list — os uploads recentes do canal
          - video-youtube       # videos.list — o que o vídeo declara de si
          - comentarios-youtube # commentThreads.list — o que se escreveu no vídeo
          - audio-youtube       # yt-dlp:public_audio — os BYTES DE SOM, rota local
          # ── AS TRÊS DO REEL ────────────────────────────────────────
          # URL directa, sem conta, sem credencial e sem fornecedor pago. O
          # `CHECK` responde `CAN_COLLECT_NOW` às três — o que faltava era a
          # fase e o ramo. `profile.discovery` continua LOCAL e não entra aqui.
          - captura-reel        # a media do Reel
          - audio-reel          # o som dela (o ffmpeg extrai do vídeo já preservado)
          - transcricao-reel    # a fala reconhecida, pelo dono único do ASR
          # ── AS TRÊS IRMÃS QUE TAMBÉM NÃO TINHAM PORTA ──────────────
          # Elas entraram em `scrap_colheita.FASES` e em `serve_fases` na mesma
          # série do `audio-youtube`, a matriz permite as três e o `CHECK`
          # responde `CAN_COLLECT_NOW` — e nenhuma tinha ramo aqui. É a mesma
          # parede do §154, e o teste das duas portas não a deixa passar.
          - canal-telegram      # a cronologia de um canal público do Telegram
          - tag-mastodon        # a tag numa instância do Mastodon (duas perguntas)
          - contas-bluesky      # contas que existem para um termo (CATALOG, não COLHEITA)
      runner:
        description: 'qual runner usar'
        required: true
        default: '2'
        type: choice
        options: ['1', '2']
      modelo:
        description: 'só para `yt-transcrever` — tiny (18,7x, ruim) / base (9,4x) / small (3,2x, bom)'
        required: false
        default: small
        type: choice
        options: [small, base, tiny]
      teto:
        description: 'teto de objetos (yt-transcrever) ou por conta (janela). Vazio = sem teto.'
        required: false
        type: string
      conta:
        description: 'só para `diario` — limitar a uma conta. Vazio = todas as que vencem.'
        required: false
        type: string
      handle:
        description: 'só para `canario-bluesky` — a conta Bluesky a observar (ex.: nome.bsky.social). NÃO é o SOURCE_ID.'
        required: false
        type: string
      site:
        description: 'só para `identidade-linkedin` — o site DA ORGANIZAÇÃO onde ela publica o próprio endereço. NUNCA linkedin.com.'
        required: false
        type: string
      # ⚠️ `pagina` NAO E `site`, E NAO E O `url` DO REEL.
      #
      #     `site`    o site PRÓPRIO da organização, de onde se descobre o
      #               endereço que ela publicou. Route de IDENTIDADE.
      #     `pagina`  a página do LinkedIn que ela SERVE PUBLICAMENTE, de
      #               onde vêm as publicações com vídeo. D23.
      #     `url`     a publicação directa de um Reel (Instagram).
      #
      # Três endereços, três actos, três nomes — e nenhum deles é o
      # SOURCE_ID, que continua a descer em `fonte`.
      pagina:
        description: 'só para `video-linkedin` — a PÁGINA PÚBLICA da organização (ex.: https://www.linkedin.com/company/<slug>/). NÃO é o SOURCE_ID.'
        required: false
        type: string
      orcamento_h:
        description: 'só para `yt-relevancia` — horas de máquina que a fila do whisper pode gastar'
        required: false
        default: '2'
        type: string
      # ── OS ENDEREÇOS DAS FASES QUE NÃO TINHAM PORTA ────────────────────
      # Cada um é o ENDEREÇO de UMA rota, e nenhum é o SOURCE_ID. A `fonte`
      # continua a descer ao lado deles, porque são duas coisas:
      #
      #     URL NAO E SOURCE_ID. CANAL NAO E SOURCE_ID. TERMO NAO E SOURCE_ID.
      #
      # `NOMEADOS`, em `coleta/scrap_colheita.py`, declara por fase QUAL destes
      # ela aceita — e recusa os outros antes da rede, em vez de os deixar
      # morrer no `**_` do adaptador.
      termo:
        description: 'só para `busca-youtube` — a palavra de busca. NÃO é o SOURCE_ID.'
        required: false
        type: string
      canal_id:
        description: 'só para `canal-youtube` — o CHANNEL_ID (UC…), que é identidade DA PLATAFORMA e não do projeto.'
        required: false
        type: string
      video:
        description: 'só para `audio-youtube` e `comentarios-youtube` — UM VIDEO_ID. NÃO é o SOURCE_ID.'
        required: false
        type: string
      videos:
        description: 'só para `video-youtube` — IDs separados por vírgula, para a rota que recebe lista.'
        required: false
        type: string
      url:
        description: 'só para as três fases do Reel — a URL directa da publicação. NÃO é o SOURCE_ID.'
        required: false
        type: string
      canal:
        description: 'só para `canal-telegram` — o canal público (ex.: agricoltura_it). NÃO é o SOURCE_ID.'
        required: false
        type: string
      instancia:
        description: 'só para `tag-mastodon` — EM QUE SERVIDOR se pergunta (o Mastodon não tem um só).'
        required: false
        type: string
      tag:
        description: 'só para `tag-mastodon` — O QUE se pergunta lá. São duas perguntas, e por isso dois campos.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sintonia-scrap-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ${{ inputs.runner == '1'
      && fromJSON('["self-hosted","Windows","X64","eame-sintonia-local"]')
      || fromJSON('["self-hosted","Windows","X64","eame-sintonia-local-2"]') }}
    defaults:
      run:
        shell: bash
    env:
      APIFY_TOKEN_POOL: ${{ secrets.APIFY_TOKEN_POOL }}
      IG_MODELO: ${{ inputs.modelo }}
      YT_MODELO: ${{ inputs.modelo }}
      YT_ORCAMENTO_H: ${{ inputs.orcamento_h }}
      # ── A SALA CANÓNICA, NO NÍVEL DO JOB E NÃO DE UM PASSO ────────────
      # ⚠️ ESTA LINHA ESTEVE A UM PASSO DE SER UM PORTÃO INÚTIL.
      # A primeira versão declarava o backend só dentro do passo do preflight.
      # O preflight passava — e o passo SEGUINTE, o que adquire de verdade,
      # corria sem a variável e escrevia o READY no ficheiro efémero.
      #
      #     UM PORTÃO QUE MEDE UM AMBIENTE E DEIXA PASSAR PARA OUTRO
      #     NÃO MEDIU NADA.
      #
      # No nível do job, o que o preflight aprova é exactamente o ambiente em
      # que a aquisição corre.
      SINTONIA_SALA_BACKEND: POSTGRES
      # O MESMO secret que o resto da casa já usa. Um nome novo seria um
      # segundo cofre para a mesma chave, e dois cofres divergem.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      # Este workflow é despachável a partir do branch PADRÃO, mas os scripts
      # vivem no branch da missão. Rodar contra um ref sem eles falharia com um
      # traceback de import — que não diz o que houve. Falhar aqui, com a frase
      # certa, custa dez segundos e evita a caçada.
      - name: 0 · o ref tem os scripts desta missão?
        run: |
          # OS CAMINHOS SÃO OS DE HOJE, E ISSO É UM CONSERTO DA C10.8B-LIVE
          # ------------------------------------------------------------------
          # Esta guarda procurava tudo em `scripts/`. Os ficheiros mudaram de
          # casa — `coleta/`, `ferramentas/` — e `scripts/` ficou VAZIO. A
          # guarda passou a reprovar toda a gente, sempre, com a frase de quem
          # despachou contra o ref errado.
          #
          #     UMA GUARDA QUE APONTA PARA A MORADA ANTIGA RECUSA A CASA CERTA.
          faltam=""
          for f in coleta/instagram_coleta.py coleta/instagram_janela.py \
                   coleta/instagram_diario.py coleta/instagram_pessoal.py \
                   ferramentas/cdp.py ferramentas/navegador.py \
                   ferramentas/contrato_ator.py coleta/youtube_janela.py \
                   coleta/youtube_relevancia.py ferramentas/youtube_transcrever.py \
                   coleta/social_scrap.py coleta/scrap_executor.py \
                   coleta/coletor.py; do
            [ -f "$f" ] || faltam="$faltam $f"
          done
          if [ -n "$faltam" ]; then
            echo "SCRIPTS_AUSENTES=YES"
            echo "O ref '${{ github.ref_name }}' nao contem:$faltam"
            echo "Despache o sintonia-scrap contra o branch que tem a coleta de Instagram."
            exit 1
          fi
          if [ ! -f data/samples/COMPETITOR-PUBLIC-COMM/PUBLIC-COMM-FIRST-BATCH-EAME.json ]; then
            echo "LOTE_AUSENTE=YES"
            echo "O lote CONGELADO nao esta neste ref. A coleta nao improvisa a lista:"
            echo "ela obedece a uma lista datada."
            exit 1
          fi
          echo "SCRIPTS_PRESENTES=YES"

      # `python3` nesta maquina e o atalho da Microsoft Store e falha. `py` funciona.
      - name: 1 · interpretador
        run: |
          for c in py python3 python; do
            if $c --version >/dev/null 2>&1; then
              echo "PY=$c" >> "$GITHUB_ENV"; echo "INTERPRETADOR=$c"; exit 0
            fi
          done
          echo "INTERPRETADOR=NENHUM"; exit 1

      # Fase que abre navegador falha DEPOIS de minutos se o Chrome nao estiver
      # onde `navegador.py` procura. Perguntar antes custa um segundo.
      - name: 2 · a porta de coleta (só para fase de navegador)
        if: contains(fromJSON('["janela","janela-perfis","janela-objetos","diario","yt-canais","yt-objetos","yt-legendas"]'), inputs.fase)
        run: PYTHONIOENCODING=utf-8 $PY ferramentas/navegador.py

      # A transcricao vive fora do repositorio, em ~/.sintonia-libs, e precisa do
      # ffmpeg no PATH. Sem um dos dois ela morre no meio do lote — depois de ja
      # ter baixado audio. Falhar aqui nao desperdica download.
      - name: 3 · a transcrição tem com que transcrever?
        # ⚠️ A LISTA CRESCEU COM AS FASES CUJA CADEIA TERMINA EM TEXTO, E ISSO É
        # O PONTO DA MISSÃO: a fase do YouTube colhe BYTES DE SOM, e quem os
        # transforma em TEXTO é o passo DERIVED da cadeia canónica, pelo dono
        # único do ASR (`ferramentas/fala_local.py`). Sem a biblioteca, a fase
        # adquire e o DERIVED sai `ASR_INDISPONIVEL` — e isso descobre-se melhor
        # ANTES da rede do que depois de ter baixado sete megabytes de áudio.
        #
        #     ADQUIRIR O FICHEIRO NÃO É ENTREGAR O FICHEIRO.  (§155)
        if: contains(fromJSON('["yt-transcrever","audio-youtube","captura-reel","audio-reel","transcricao-reel"]'), inputs.fase)
        run: |
          ffmpeg -version >/dev/null 2>&1 \
            && echo "FFMPEG=OK" \
            || { echo "FFMPEG=AUSENTE · ffmpeg nao esta no PATH desta maquina"; exit 1; }
          PYTHONIOENCODING=utf-8 $PY - <<'PYEOF'
          import os, sys
          libs = os.environ.get('SINTONIA_LIBS') or os.path.join(
              os.path.expanduser('~'), '.sintonia-libs')
          if os.path.isdir(libs):
              sys.path.insert(0, libs)
          try:
              import faster_whisper  # noqa: F401
              print('FASTER_WHISPER=OK · libs em %s' % libs)
          except ImportError:
              print('FASTER_WHISPER=AUSENTE · esperado em %s' % libs)
              print('instale com: py -m pip install --target "%s" faster-whisper' % libs)
              raise SystemExit(1)
          # O YouTube nao entrega URL de midia direta: a faixa de audio e negociada
          # pelo player, e quem negocia e o yt-dlp. O mesmo vale para o Reel: a
          # cadeia dele tambem negocia a media pelo `yt-dlp`. Sem a ferramenta a
          # fase baixa zero audio DEPOIS de carregar o modelo — que leva dezenas
          # de segundos por nada.
          if os.environ.get('FASE') in ('yt-transcrever', 'audio-youtube',
                                        'captura-reel', 'audio-reel',
                                        'transcricao-reel'):
              try:
                  import yt_dlp  # noqa: F401
                  print('YT_DLP=OK')
              except ImportError:
                  print('YT_DLP=AUSENTE · esperado em %s' % libs)
                  print('instale com: py -m pip install --target "%s" yt-dlp' % libs)
                  raise SystemExit(1)
          PYEOF
        env:
          FASE: ${{ inputs.fase }}

      # Presenca e formato — nunca valor. Só a fase que fala com a Apify precisa.
      - name: 4 · censo do pool (só para fase que usa Apify)
        if: contains(fromJSON('["contratos","plano","bio","posts","reels","comentarios","liquidar"]'), inputs.fase)
        run: PYTHONIOENCODING=utf-8 $PY ferramentas/apify_pool.py

      # O portao de dado pessoal e' o unico que nao aceita ser aberto por engano:
      # ele exige IG_COMENTARIOS_AUTORIZADO=1, que NAO esta definido aqui de
      # proposito. Quem tem autoridade liga na maquina, e assume a decisao.
      - name: 5 · o portão de dado pessoal (só para `comentarios`)
        if: inputs.fase == 'comentarios'
        run: |
          PYTHONIOENCODING=utf-8 $PY coleta/instagram_pessoal.py estado
          echo "--- este workflow NAO define IG_COMENTARIOS_AUTORIZADO ---"
          echo "Se o portao estiver CLOSED, a fase abaixo para sozinha. E' o desenho."

      # ══════════════════════════════════════════════════════════════════
      # 5b · O PREFLIGHT — as duas perguntas que vêm ANTES de adquirir
      # ══════════════════════════════════════════════════════════════════
      # Nasceu de duas medições da `C-ITALIA-FIRST-REAL-COLLECTION-CANARY-V1`,
      # e as duas pararam a primeira coleta real italiana:
      #
      #   1. o READY era escrito no workspace do runner e ninguém o guardava —
      #      nenhum `git add`, nenhum artefato, nenhum dono em banco, e o
      #      `checkout` seguinte limpa o que não está versionado;
      #   2. o único medidor de egresso desta casa vivia DENTRO de uma rota de
      #      aquisição, o que tornava impossível exigir `IT` ANTES de adquirir.
      #
      #     COLETAR PARA UMA SALA QUE NÃO SOBREVIVE É PAGAR REDE POR NADA.
      #     UM PREFLIGHT QUE SÓ CORRE DEPOIS DE COMEÇAR NÃO É UM PREFLIGHT.
      #
      # ⚠️ A CONDIÇÃO É UMA LISTA DE EXCLUSÃO, E AQUI ISSO É DE PROPÓSITO.
      # O `scrap` de cima já pagou por uma lista de exclusão que não sabia o que
      # ainda não tinha nascido. Aqui a direção é a inversa, e é a segura: só as
      # fases que NÃO tocam rede de aquisição ficam de fora. Uma fase nova nasce
      # com o portão ligado, e não sem ele.
      #
      #     FALHA FECHADA POR OMISSÃO.
      #
      # ⚠️ E ELE NÃO ADQUIRE NADA. A única rede que usa é o checker público de
      # egresso, sem credencial e sem custo.
      # ⚠️ DOIS PASSOS, E NAO UM COMPOSITOR. Houve uma versao desta missão com um
      # `motor/preflight_da_coleta.py` a encadear os dois portões. Foi deitada
      # fora: cada dono já sabe responder por si, e a ORDEM mora aqui — que é o
      # único sítio onde ela é observável.
      #
      #     UM COMPOSITOR QUE SÓ ENCADEIA DOIS DONOS
      #     É UM TERCEIRO SÍTIO ONDE A VERDADE PODE DIVERGIR.
      #
      # ── 5a-IT · A BANCADA ITALIANA NASCE ANTES DOS PORTÕES — BG-01 ──────
      # A fase italiana NUNCA usa a Supabase de produção: o job cria um
      # PostgreSQL 16 descartável nesta máquina (binários portáteis, fora
      # do repo), aplica as migrations pela cadeia canónica, e escreve
      # SINTONIA_SALA_DSN no GITHUB_ENV — que o dono da Sala lê ANTES de
      # SUPABASE_DB_URL. Assim o portão 5b mede exactamente o ambiente em
      # que a aquisição vai correr, sem env próprio no passo do portão.
      #
      #     PRODUÇÃO NÃO É LABORATÓRIO.  DESCARTÁVEL → PROVA → depois LIVE.
      #
      # A senha é temporária, do cluster descartável, e morre com ele no
      # passo 9z-IT (always). Nunca se ecoa a DSN inteira.
      - name: 5a-IT · a bancada italiana nasce (PostgreSQL descartável)
        if: inputs.fase == 'italia-documento'
        run: |
          set -eu
          PGBIN="${SINTONIA_PG_PORTATIL:-$HOME/orca/pgtmp/pgsql/bin}"
          [ -x "$PGBIN/initdb.exe" ] || { echo 'PG_PORTATIL_AUSENTE: initdb nao achado em '"$PGBIN"; exit 1; }
          CLUSTER="$RUNNER_TEMP/pg-italia-$GITHUB_RUN_ID"
          rm -rf "$CLUSTER"
          printf 'descartavel' > "$RUNNER_TEMP/.pgpw"
          "$PGBIN/initdb.exe" -D "$CLUSTER" -U postgres --auth=md5 --pwfile="$RUNNER_TEMP/.pgpw" -E UTF8 --no-sync >/dev/null
          rm -f "$RUNNER_TEMP/.pgpw"
          "$PGBIN/pg_ctl.exe" -D "$CLUSTER" -o '-p 54329 -h 127.0.0.1' -l "$CLUSTER/servidor.log" -w start >/dev/null
          export PGPASSWORD=descartavel
          "$PGBIN/psql.exe" -X -q -w -c 'create database descartavel;' postgresql://postgres@localhost:54329/postgres < /dev/null
          # migrations pela cadeia canónica — o único aplicador desta casa
          PATH="$PGBIN:$PATH" bash motor/cadeia_canonica.sh migrations 'postgresql://postgres:descartavel@localhost:54329/descartavel'
          # o ambiente que os portões vão medir É o da aquisição: nível de job
          echo "SINTONIA_SALA_DSN=postgresql://postgres:descartavel@localhost:54329/descartavel" >> "$GITHUB_ENV"
          echo "BANCO_DESCARTAVEL_URL=postgresql://postgres:descartavel@localhost:54329/descartavel" >> "$GITHUB_ENV"
          echo "PGPASSWORD=descartavel" >> "$GITHUB_ENV"
          echo "ITALY_OPS_ROOT=$RUNNER_TEMP/ops-italia-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          # ⚠️ O WORKFLOW DECLARA O psql; NÃO O DEIXA À DESCOBERTA DO PATH.
          # O replay canário 3 (run 35232024024, know-how §135) passou os três
          # portões e caiu na primeira `subprocess.run(["psql", …])` do runtime:
          # FileNotFoundError. A linha do GITHUB_PATH abaixo continua para o
          # shell (o `.sh` das migrations), mas o runtime Python lê SÓ a
          # declaração explícita, em caminho NATIVO — `cygpath -w` converte
          # `/c/…` para `C:\…`, que é o que o CreateProcess do Python lê.
          #
          #     QUEM CRIA A BANCADA SABE ONDE ESTÁ O psql. QUE O DIGA.
          #
          # `cygpath` é do Git for Windows, o mesmo bash que corre este passo;
          # se faltar, o passo falha AQUI, com a frase certa, e não no passo 6.
          command -v cygpath >/dev/null || { echo 'CYGPATH_AUSENTE: nao consigo declarar o psql em caminho nativo'; exit 1; }
          PSQL_NATIVO="$(cygpath -w "$PGBIN/psql.exe")"
          [ -f "$PGBIN/psql.exe" ] || { echo 'PSQL_AUSENTE: '"$PGBIN"'/psql.exe nao existe'; exit 1; }
          echo "SINTONIA_PSQL_EXE=$PSQL_NATIVO" >> "$GITHUB_ENV"
          echo "psql declarado: $PSQL_NATIVO"
          echo "$PGBIN" >> "$GITHUB_PATH"

      # A SALA VEM PRIMEIRO de propósito: não custa rede nenhuma, e é a pergunta
      # cuja resposta errada torna toda a aquisição desperdício.
      - name: 5b · a sala onde o READY vai pousar sobrevive a este job?
        if: "!contains(fromJSON('[\"contratos\",\"plano\",\"semaforo\",\"liquidar\",\"portao-pessoal\",\"yt-legenda-bruto\"]'), inputs.fase)"
        run: |
          PYTHONIOENCODING=utf-8 $PY admissao/sala_de_espera.py --portao

      # ⚠️ E SÓ AGORA A REDE. `UNKNOWN` bloqueia tal como `FR` ou `US`: não se
      # adquire material real sobre um ambiente de rede por medir.
      #
      #     UNKNOWN != IT.
      #
      # Isto prova o AMBIENTE DE EXECUÇÃO, e nunca a geografia do dado:
      # `VPN_LOCATION != SOURCE_LOCATION` e `VPN_LOCATION != FACT_LOCATION`.
      - name: 5c · e este runner sai mesmo por Itália?
        if: "!contains(fromJSON('[\"contratos\",\"plano\",\"semaforo\",\"liquidar\",\"portao-pessoal\",\"yt-legenda-bruto\"]'), inputs.fase)"
        run: |
          PYTHONIOENCODING=utf-8 $PY superficie/rede.py --portao-de-egresso IT

      - name: 6 · rodar a fase
        # ── A CHAVE DA API OFICIAL ENTRA SÓ NAS FASES QUE A USAM ────────────
        # `YOUTUBE_DATA_API_KEY` é o que `coleta/youtube_oficial.py::ENV_CHAVE`
        # lê, e as quatro fases oficiais (busca · canal · video · comentarios)
        # param em `CREDENTIAL_MISSING` sem ela — medido: o `CHECK` delas
        # responde `CAN=False / CREDENTIAL_MISSING` num ambiente sem a chave, e
        # `CAN_COLLECT_NOW` com ela declarada. `audio-youtube` NÃO entra nesta
        # lista: a rota dela é local (`yt-dlp` + `ffmpeg`), e dar-lhe a chave
        # seria alargar a superfície de um segredo a quem não o usa.
        #
        #     UMA CREDENCIAL SÓ ENTRA ONDE É NECESSÁRIA.
        #
        # O valor nunca é ecoado: o passo declara presença, nunca conteúdo.
        env:
          YOUTUBE_DATA_API_KEY: ${{ contains(fromJSON('["busca-youtube","canal-youtube","video-youtube","comentarios-youtube"]'), inputs.fase) && secrets.YOUTUBE_DATA_API_KEY || '' }}
        run: |
          echo "FASE=${{ inputs.fase }} · RUNNER=${{ runner.name }} · REF=${{ github.ref_name }}"
          TETO='${{ inputs.teto }}'
          CONTA='${{ inputs.conta }}'
          # ── O APELIDO DA FONTE: UMA TABELA, UM SÍTIO ──────────────────
          # O pedido diz a INTENÇÃO («colete agricultores»), e o orquestrador é
          # quem escolhe o executor, cunha o RUN_ID e leva a colheita à porta.
          # O que este workflow sabe — e só isto — é traduzir o TERRITÓRIO que a
          # fonte já declara no seu SOURCE_ID para o apelido que a casa usa.
          #
          #     O ALVO É PROPRIEDADE DA FONTE.
          #     QUEM ESCOLHE O EXECUTOR É O PEDIDO.
          #
          # Sem apelido para a fonte a porta RECUSA, em vez de adivinhar um
          # território: um alvo inventado julga o item contra a régua errada, e
          # esse resultado fica no livro como se fosse uma medição (§156).
          # Uma pergunta, um sitio: oito ramos precisam do SOURCE_ID do pedido.
          fonte_do_pedido() {
            if [ -z "$1" ]; then
              echo 'FONTE_OBRIGATORIA: esta fase exige um SOURCE_ID do Atlas em `fonte`.'
              echo '  Sem ele nao ha colheita: o SCRAP observa PLATAFORMAS e a porta fala em FONTES.'
              exit 2
            fi
            echo "$1"
          }
          assunto_do_alvo_da_fonte() {
            case "$1" in
              IT-T8-*) echo 'colete agricultores' ;;
              IT-T9-*) echo 'colete concorrentes' ;;
              *) return 1 ;;
            esac
          }
          # ══════════════════════════════════════════════════════════
          # QUEM ENTRA POR ONDE — E POR QUE ALGUMAS NÃO ENTRAM
          # ══════════════════════════════════════════════════════════
          # A C10.6D censou estruturalmente as portas deste workflow e
          # classificou cada fase pelo COMPORTAMENTO, nunca pelo nome.
          #
          #     WORKFLOW É DISPARADOR. WORKFLOW NÃO É MOTOR DE COLETA.
          #
          # COLLECTION com rota canônica  ->  entrada canônica
          # COLLECTION sem rota canônica  ->  RECUSA ALTA (não corre nada)
          # OPERAÇÃO / MEDIÇÃO / JULGAMENTO -> continua, e NÃO é fabricada
          #                                    como Collection para o número
          #                                    de bypasses baixar
          #
          #     FABRICAR COLLECTION PARA A MÉTRICA PASSAR É MENTIR COM MÉTRICA.
          recusar() {
            echo "FASE_BLOQUEADA=$1"
            echo "  ESPECIE=$2"
            echo "  PORQUE=$3"
            echo "  A implementacao NAO corre por aqui. Uma porta que coleta sem"
            echo "  perguntar ao dono da decisao e um desejo, nao uma decisao."
            exit 2
          }
          case "${{ inputs.fase }}" in
            # ── COLLECTION · ENTRADA CANÔNICA ────────────────────────────
            # `leis/social_matriz.py` declara INSTAGRAM/INCREMENTAL com a rota
            # `instagram_janela.py:grade`, classe PUBLIC_BROWSER, PERMITIDA
            # CONDICIONAL, estado PROVED. A matriz nomeia o ficheiro e permite
            # a rota — e durante todo esse tempo o workflow corria o ficheiro
            # direto, sem passar por portão, registo, RUN ou rastro.
            #
            # A implementação é a MESMA e escreve os MESMOS ficheiros. O que
            # muda é o caminho até ela.
            #
            # ── E DESDE A SCRAP-FLOW-01 ELA ENTRA PELO ORQUESTRADOR ──────
            # `coleta/social_scrap.py coletar` chegava ao `COLLECT` e parava
            # ali: o que a corrida colhia nunca via `coleta/ingresso.py`, e
            # portanto nunca chegava a admissao. A porta existia, o executor
            # existia, e entre os dois nao havia aresta nenhuma.
            #
            #     MODULE EXISTS != EDGE EXISTS != FLOW EXISTS.
            #
            # O que o disparador diz agora e uma INTENCAO — «colete
            # concorrentes», com fase e fonte — e quem escolhe o executor, cunha
            # o RUN_ID, le o retorno declarado e leva a colheita a porta e o
            # orquestrador canonico. O ator, a rota e o provider continuam a
            # nao aparecer aqui.
            #
            #     WORKFLOW E DISPARADOR. WORKFLOW NAO E MOTOR DE COLETA.
            # ── ITÁLIA, PELA PORTA CANÓNICA — BG-01 ──────────────────
            # O disparador diz a INTENÇÃO e nomeia a FONTE; o orquestrador
            # escolhe o executor, cunha o RUN_ID e leva a colheita à porta.
            # NUNCA se chama italy_pilot_collect.mjs daqui — workflow é
            # disparador, não motor de coleta. E fonte é OBRIGATÓRIA:
            # sem nome não há colheita (BG-06), e o alvo deriva do
            # TERRITÓRIO que o próprio SOURCE_ID declara.
            italia-documento)
              FONTE_IT='${{ inputs.fonte }}'
              if [ -z "$FONTE_IT" ]; then
                echo 'FONTE_OBRIGATORIA: a fase italia-documento exige um SOURCE_ID do Atlas em `fonte`.'
                exit 2
              fi
              case "$FONTE_IT" in
                IT-T2-*) ASSUNTO='colete clima' ;;
                IT-T3-*) ASSUNTO='colete pragas' ;;
                IT-T4-*) ASSUNTO='colete regulatorio' ;;
                *) echo "FONTE_FORA_DO_PILOTO: $FONTE_IT nao e um SOURCE_ID italiano de T2/T3/T4."; exit 2 ;;
              esac
              PYTHONIOENCODING=utf-8 $PY orquestrador/orquestrador.py \
                "$ASSUNTO" \
                --filtro pais=IT \
                --filtro fonte="$FONTE_IT" ;;

            # ── A JANELA DO INSTAGRAM: A MATRIZ JÁ A RECUSA ───────────────
            # ⚠️ ESTE RAMO CORRIA A PORTA CANÓNICA E COLHIA ZERO — e isso foi
            # medido, não suposto:
            #
            #     COLLECT('INSTAGRAM','instagram.profile.discovery')
            #         -> RESULT = ROUTE_NOT_ALLOWED · objetos = 0 · rede = 0
            #
            # O roteador já consultava a matriz e recusava. O que faltava era a
            # PORTA dizê-lo: o `CHECK` respondia `CAN_COLLECT_NOW` e a corrida
            # abria RUN, checkpoint e etapa para depois não colher nada.
            #
            #     UM PORTAO QUE DIZ SIM A QUEM A LEI RECUSA NAO E UM PORTAO.
            #
            # Agora o `CHECK` consulta `leis/social_matriz.py` e o estado é o
            # nome dela: `ROUTE_NOT_ALLOWED`. Isto não muda o que se colhe (já
            # era zero); muda QUEM O DIZ e QUANDO — antes de abrir a corrida, e
            # com o nome do dono da política.
            #
            # D19.1: enquanto o Instagram estiver POLICY_BLOCK, ele fornece zero
            # dados à Big Collection. `profile.discovery` continua declarada
            # `PARTIAL` e `LOCAL/DATACENTER_BLOCKED`; a janela volta quando a
            # rota oficial existir e estiver provada.
            janela|janela-perfis|janela-objetos)
              recusar "${{ inputs.fase }}" COLLECTION_DISCOVER \
                "INSTAGRAM/INCREMENTAL e ROUTE_NOT_ALLOWED na matriz (nenhuma rota viavel sobrou) e o Instagram esta POLICY_BLOCK (D19.1). O CHECK passou a consultar a matriz: CAN=False · STATE=ROUTE_NOT_ALLOWED" ;;

            # ── O CANÁRIO DA RELEASE V1 ──────────────────────────────────
            # Ramo PRÓPRIO, e não mais um nome no `case` de cima, porque ele
            # leva um filtro que a janela não leva: `handle`, o endereço da
            # conta. Enfiá-lo no ramo da janela mandaria um argumento que a
            # rota do Instagram não conhece.
            #
            # `handle` é o ENDEREÇO; `fonte` é a IDENTIDADE PROVADA. Quem
            # dispara nomeia os dois, e nenhum se deriva do outro.
            #
            #     HANDLE NÃO É SOURCE_ID.
            #
            # Mesma entrada canônica do ramo acima: o disparador diz a
            # INTENÇÃO, e o orquestrador é que escolhe o executor, cunha o
            # RUN_ID e leva a colheita à porta. O ator, a rota e o provider
            # continuam a não aparecer aqui.
            canario-bluesky)
              PYTHONIOENCODING=utf-8 $PY orquestrador/orquestrador.py \
                "colete concorrentes" \
                --filtro fase="${{ inputs.fase }}" \
                --filtro pais=IT \
                --filtro fonte="${{ inputs.fonte }}" \
                --filtro handle="${{ inputs.handle }}" ;;

            # ── A IDENTIDADE DO LINKEDIN ─────────────────────────────────
            # Ramo próprio pela mesma razão do canário: ele leva `site`, que
            # é o endereço do site DA ORGANIZAÇÃO — nunca `linkedin.com`, e
            # nunca um buscador. O que volta é CATÁLOGO: uma entidade de onde
            # se PODE colher, e não material observado.
            #
            #     IDENTITY != CONTENT. E CATALOG != COLHEITA.
            #
            # Pedir PUBLICAÇÕES do LinkedIn não tem ramo aqui, e a ausência é
            # a declaração: `LINKEDIN/FETCH_POST` tem duas rotas e as duas
            # estão `PERMITIDA = NAO`.
            identidade-linkedin)
              PYTHONIOENCODING=utf-8 $PY orquestrador/orquestrador.py \
                "colete concorrentes" \
                --filtro fase="${{ inputs.fase }}" \
                --filtro pais=IT \
                --filtro fonte="${{ inputs.fonte }}" \
                --filtro site="${{ inputs.site }}" ;;

            # ── D23 · O VÍDEO DA PÁGINA PÚBLICA DE ORGANIZAÇÃO ─────────────
            # Ramo PRÓPRIO, pela mesma razão do irmão acima: leva um
            # endereço que nenhuma outra fase leva — a PÁGINA PÚBLICA da
            # ORGANIZAÇÃO.
            #
            # ⚠️ A MATRIZ PERMITE ESTA ROTA E A PLATAFORMA PROÍBE — e é isso
            # que o dono autorizou, com o risco assumido (D23). As duas
            # frases ficam escritas, e viajam em cada objeto que sai daqui:
            #
            #     OWNER_AUTHORIZED        = SIM        (decisão do dono)
            #     PLATFORM_POLICY_STATUS  = DISALLOWED (robots.txt, medido)
            #
            #     PERMITIDA POR DECISÃO DO DONO ≠ PERMITIDA PELA PLATAFORMA.
            #     ESCONDER A SEGUNDA SERIA A CASA A MENTIR NO PRÓPRIO RASTO.
            #
            # `fonte` é OBRIGATÓRIA: o SCRAP observa PLATAFORMAS e a porta
            # fala em FONTES. Sem SOURCE_ID provado não há colheita a
            # declarar, por muito que os bytes tenham chegado.
            #
            # O teto desce SÓ quando alguém o escreveu: um filtro vazio não
            # é um teto de zero, e passá-lo vazio diria à rota que se pediu
            # zero vídeos quando ninguém pediu nada.
            video-linkedin)
              FONTE_LI="$(fonte_do_pedido '${{ inputs.fonte }}')"
              PEDIDO_TETO=''
              if [ -n "${{ inputs.teto }}" ]; then
                PEDIDO_TETO="--filtro teto=${{ inputs.teto }}"
              fi
              PYTHONIOENCODING=utf-8 $PY orquestrador/orquestrador.py \
                "colete concorrentes" \
                --filtro fase="video-linkedin" \
                --filtro pais=IT \
                --filtro fonte="$FONTE_LI" \
                --filtro pagina="${{ inputs.pagina }}" \
                $PEDIDO_TETO ;;

            # ── AS CINCO OFICIAIS DO YOUTUBE, PELA PORTA CANÓNICA ─────────
            # `coleta/youtube_janela.py canais|objetos` sobe NAVEGADOR e
            # continua recusado acima — a rota PUBLIC_BROWSER não está
            # declarada na matriz. Estas cinco são outras: têm rota declarada,
            # adaptador registado, prova e `CHECK=CAN_COLLECT_NOW`, e entram
            # pelo MESMO caminho dos outros ramos canónicos — o disparador diz
            # a intenção, e o orquestrador escolhe o executor, cunha o RUN_ID e
            # leva a colheita à porta.
            #
            #     WORKFLOW É DISPARADOR. WORKFLOW NÃO É MOTOR DE COLETA.
            #
            # ⚠️ UM ENDEREÇO POR FASE, E NENHUM EMPRESTADO. `video` é UM id e
            # `videos` é uma LISTA — são rotas diferentes, e `NOMEADOS` fecha a
            # lista de cada fase. Enfiar os cinco num ramo só mandaria a cada
            # rota um argumento que ela não conhece.
            #
            #     UM ID NÃO É UMA LISTA DE IDS.
            # ⚠️ UM RAMO POR FASE, E O ENDEREÇO ESCRITO À VISTA EM CADA UM.
            # Havia aqui um `case` interno a escolher o filtro, e ele custou
            # duas coisas: o leitor tinha de o seguir para saber o que cada fase
            # manda, e a prova das duas portas — que lê o `case` externo — lia
            # os rótulos internos como se fossem fases. A duplicação de cinco
            # linhas de guarda compra legibilidade e uma prova que não se
            # engana.
            #
            #     UMA INDIRECÇÃO A MENOS É UMA PORTA A MAIS QUE SE CONSEGUE LER.
            busca-youtube)
              FONTE_YT="$(fonte_do_pedido '${{ inputs.fonte }}')"
              ASSUNTO="$(assunto_do_alvo_da_fonte "$FONTE_YT")" || {
                echo "FONTE_SEM_APELIDO: $FONTE_YT — esta porta so sabe apelidar IT-T8-* e IT-T9-*."
                exit 2
              }
              PYTHONIOENCODING=utf-8 $PY orquestrador/orquestrador.py "$ASSUNTO" \
                --filtro fase=busca-youtube --filtro fonte="$FONTE_YT" \
                --filtro pais=IT --filtro termo='${{ inputs.termo }}' ;;
            canal-youtube)
              FONTE_YT="$(fonte_do_pedido '${{ inputs.fonte }}')"
              ASSUNTO="$(assunto_do_alvo_da_fonte "$FONTE_YT")" || {
                echo "FONTE_SEM_APELIDO: $FONTE_YT — esta porta so sabe apelidar IT-T8-* e IT-T9-*."
                exit 2
              }
              PYTHONIOENCODING=utf-8 $PY orquestrador/orquestrador.py "$ASSUNTO" \
                --filtro fase=canal-youtube --filtro fonte="$FONTE_YT" \
                --filtro pais=IT --filtro canal_id='${{ inputs.canal_id }}' ;;
            video-youtube)
              FONTE_YT="$(fonte_do_pedido '${{ inputs.fonte }}')"
              ASSUNTO="$(assunto_do_alvo_da_fonte "$FONTE_YT")" || {
                echo "FONTE_SEM_APELIDO: $FONTE_YT — esta porta so sabe apelidar IT-T8-* e IT-T9-*."
                exit 2
              }
              PYTHONIOENCODING=utf-8 $PY orquestrador/orquestrador.py "$ASSUNTO" \
                --filtro fase=video-youtube --filtro fonte="$FONTE_YT" \
                --filtro pais=IT --filtro videos='${{ inputs.videos }}' ;;
            comentarios-youtube)
              FONTE_YT="$(fonte_do_pedido '${{ inputs.fonte }}')"
              ASSUNTO="$(assunto_do_alvo_da_fonte "$FONTE_YT")" || {
                echo "FONTE_SEM_APELIDO: $FONTE_YT — esta porta so sabe apelidar IT-T8-* e IT-T9-*."
                exit 2
              }
              PYTHONIOENCODING=utf-8 $PY orquestrador/orquestrador.py "$ASSUNTO" \
                --filtro fase=comentarios-youtube --filtro fonte="$FONTE_YT" \
                --filtro pais=IT --filtro video='${{ inputs.video }}' ;;
            audio-youtube)
              FONTE_YT="$(fonte_do_pedido '${{ inputs.fonte }}')"
              ASSUNTO="$(assunto_do_alvo_da_fonte "$FONTE_YT")" || {
                echo "FONTE_SEM_APELIDO: $FONTE_YT — esta porta so sabe apelidar IT-T8-* e IT-T9-*."
                exit 2
              }
              PYTHONIOENCODING=utf-8 $PY orquestrador/orquestrador.py "$ASSUNTO" \
                --filtro fase=audio-youtube --filtro fonte="$FONTE_YT" \
                --filtro pais=IT --filtro video='${{ inputs.video }}' ;;

            # ── AS TRÊS IRMÃS DA FORMA ABERTA, PELA PORTA CANÓNICA ────────
            # `telegram.channel.incremental`, `mastodon.hashtag.search` e
            # `bluesky.account.discovery` partilham a FORMA (adaptador_aberto ·
            # campo ROTA · ONLINE) e a matriz permite as três. Cada uma entra
            # pelo seu ENDEREÇO, e nenhum deles é o SOURCE_ID:
            #
            #     CANAL, TAG, INSTANCIA E TERMO SÃO ENDEREÇOS.
            #     IDENTIDADE VEM DO PEDIDO.
            #
            # `mastodon` leva DOIS porque são duas perguntas: a instância diz EM
            # QUE SERVIDOR se pergunta, e a tag diz O QUE se pergunta lá.
            canal-telegram)
              FONTE_AB="$(fonte_do_pedido '${{ inputs.fonte }}')"
              ASSUNTO="$(assunto_do_alvo_da_fonte "$FONTE_AB")" || {
                echo "FONTE_SEM_APELIDO: $FONTE_AB — esta porta so sabe apelidar IT-T8-* e IT-T9-*."
                exit 2
              }
              PYTHONIOENCODING=utf-8 $PY orquestrador/orquestrador.py "$ASSUNTO" \
                --filtro fase=canal-telegram --filtro fonte="$FONTE_AB" \
                --filtro pais=IT --filtro canal='${{ inputs.canal }}' ;;
            tag-mastodon)
              FONTE_AB="$(fonte_do_pedido '${{ inputs.fonte }}')"
              ASSUNTO="$(assunto_do_alvo_da_fonte "$FONTE_AB")" || {
                echo "FONTE_SEM_APELIDO: $FONTE_AB — esta porta so sabe apelidar IT-T8-* e IT-T9-*."
                exit 2
              }
              # DOIS enderecos porque sao duas perguntas: a INSTANCIA diz em que
              # servidor se pergunta, e a TAG diz o que se pergunta la.
              PYTHONIOENCODING=utf-8 $PY orquestrador/orquestrador.py "$ASSUNTO" \
                --filtro fase=tag-mastodon --filtro fonte="$FONTE_AB" \
                --filtro pais=IT --filtro instancia='${{ inputs.instancia }}' \
                --filtro tag='${{ inputs.tag }}' ;;
            contas-bluesky)
              FONTE_AB="$(fonte_do_pedido '${{ inputs.fonte }}')"
              ASSUNTO="$(assunto_do_alvo_da_fonte "$FONTE_AB")" || {
                echo "FONTE_SEM_APELIDO: $FONTE_AB — esta porta so sabe apelidar IT-T8-* e IT-T9-*."
                exit 2
              }
              PYTHONIOENCODING=utf-8 $PY orquestrador/orquestrador.py "$ASSUNTO" \
                --filtro fase=contas-bluesky --filtro fonte="$FONTE_AB" \
                --filtro pais=IT --filtro termo='${{ inputs.termo }}' ;;

            # ── AS TRÊS DO REEL: CONSTRUÍDAS, E RECUSADAS PELA MATRIZ ─────
            # A fase EXISTE — `scrap_colheita.FASES`, `NOMEADOS` e
            # `receitas.serve_fases` — e o caminho está montado. Quem a recusa
            # hoje é a LEI, e o portão passou a dizê-lo:
            #
            #     mz.decisao('INSTAGRAM','FETCH_TRANSCRIPT') -> ROUTE_NOT_ALLOWED
            #     CHECK('INSTAGRAM','instagram.reel.transcribe')
            #         -> CAN=False · STATE=ROUTE_NOT_ALLOWED
            #
            # A autorização nomeada do dono vale para o YOUTUBE (D17.4) e NÃO
            # se estende a Reels (D19.2): até existir a conta Instagram Business
            # do PROJETO, a Página Meta e o app próprios, o Instagram permanece
            # POLICY_BLOCK e fornece zero dados à Big Collection (D19.1).
            #
            #     CONSTRUÍDA != LIGADA != PERMITIDA.
            #
            # ⚠️ E ISTO NÃO É UMA RECUSA DE CONTEÚDO: é uma recusa de POLÍTICA.
            # O estado que sai é o da matriz, com o nome dela — nunca um
            # «recusada» que julga o que ninguém leu.
            captura-reel|audio-reel|transcricao-reel)
              recusar "${{ inputs.fase }}" COLLECTION_FETCH \
                "INSTAGRAM/FETCH_TRANSCRIPT e ROUTE_NOT_ALLOWED na matriz; a autorizacao nomeada do dono vale para o YOUTUBE (D17.4) e NAO para Reels (D19). A fase esta construida (FASES + serve_fases) e esta porta recusa-a ate existir a conta Business do PROJETO e a API oficial" ;;

            # ── COLLECTION SEM ROTA CANÔNICA · RECUSA ────────────────────
            # `coleta/instagram_diario.py rodar` importa `instagram_janela` e
            # corre a MESMA rota — mas com uma unidade de trabalho própria (a
            # passada do DIA) que nenhuma capacidade declara. Registá-la aqui
            # seria inventar capacidade para o número fechar.
            diario)
              recusar diario COLLECTION_DISCOVER \
                "a passada do dia usa a rota da janela, mas nenhuma capacidade declara a unidade 'conta x dia'" ;;

            # `coleta/youtube_janela.py canais|objetos` sobe NAVEGADOR contra
            # youtube.com. A matriz declara YOUTUBE/INCREMENTAL com DUAS rotas:
            # a API oficial (SIM) e o feed nativo (NAO). PUBLIC_BROWSER nao
            # esta declarada — e os ToS do YouTube proibem meio automatizado
            # sem permissao escrita.
            yt-canais|yt-objetos)
              recusar "${{ inputs.fase }}" COLLECTION_DISCOVER \
                "rota PUBLIC_BROWSER nao declarada em YOUTUBE/INCREMENTAL; a matriz so conhece OFFICIAL_API_FREE (SIM) e feeds (NAO)" ;;

            # `yt-legendas` chama `_timedtext`. A matriz diz, com prova medida
            # na C5: YOUTUBE/FETCH_TRANSCRIPT · timedtext · DIRECT_HTTP ·
            # PERMITIDA=NAO · ROUTE_NOT_ALLOWED, por ToS, por `Disallow: /api/`
            # e pelas Developer Policies III.D.7 e III.E.6.
            #
            #     UMA ROTA QUE FUNCIONA NAO E UMA ROTA PERMITIDA.
            yt-legendas)
              recusar yt-legendas COLLECTION_DERIVED \
                "timedtext e ROUTE_NOT_ALLOWED na matriz desde a C5 — ToS, Disallow /api/ e Developer Policies" ;;

            # ── AS DUAS FASES LEGADAS DA FILA DO WHISPER ─────────────────
            # ⚠️ AQUI ESTAVA ESCRITO QUE «a matriz nao declara capacidade de
            # BYTES para YOUTUBE», E ISSO DEIXOU DE SER VERDADE. Medido no HEAD
            # (origin/unificacao-v1 @ 77077dee, 2026-09-19 em diante):
            #
            #     leis/social_matriz.py   YOUTUBE / FETCH_AUDIO_BYTES
            #         yt-dlp:public_audio · LOCAL_EXECUTOR · PERMITIDA=SIM
            #         OWNER_AUTHORIZED=SIM · PLATFORM_POLICY=DISALLOWED
            #         PROVED (C13) · limite PUBLIC_AUDIO_ONLY
            #     CHECK('YOUTUBE','youtube.public_audio') -> CAN_COLLECT_NOW
            #
            #     O TEXTO DA RECUSA ENVELHECEU MAIS DEPRESSA QUE A DECISÃO.
            #
            # `yt-alvos` NÃO adquire nada: lê a fila local que a relevância já
            # escreveu e imprime-a. Não é Collection, e recusá-la como se fosse
            # era um erro de ESPÉCIE — o mesmo que `yt-relevancia` já teve.
            #
            #     COLETAR != ADMITIR != JULGAR.
            yt-alvos)
              PYTHONIOENCODING=utf-8 $PY ferramentas/youtube_transcrever.py alvos ;;

            # `yt-transcrever` faz a aquisição que AGORA tem rota declarada e
            # autorizada — mas fá-la por FORA da porta canónica: sem RUN_ID
            # cunhado pela casa, sem `CHECK`, sem RAW preservado, e com a fala
            # reconhecida por um caminho paralelo. A aquisição de som do YouTube
            # tem porta canónica desde esta missão: a fase `audio-youtube`
            # (`youtube.public_audio`). O TEXTO vem depois, do passo DERIVED da
            # cadeia, pelo dono único do ASR (`ferramentas/fala_local.py`).
            #
            #     A ROTA EXISTE. A PORTA É OUTRA — E É UMA SÓ.
            #
            # Isto NÃO é uma recusa da matriz: é a recusa do caminho paralelo, e
            # ela nomeia a porta que faz o mesmo acto dentro do fluxo.
            yt-transcrever)
              echo 'REDIRECIONAMENTO: use fase=audio-youtube · fonte=<SOURCE_ID> · video=<VIDEO_ID>'
              recusar yt-transcrever COLLECTION_FETCH \
                "a aquisicao de audio do YouTube TEM rota declarada e autorizada (FETCH_AUDIO_BYTES · yt-dlp:public_audio · PERMITIDA=SIM pelo dono, C13) e tem porta canonica — a fase audio-youtube. Esta fase faz a MESMA aquisicao por fora da porta: sem RUN_ID cunhado pela casa, sem CHECK, sem RAW preservado e com a fala reconhecida por um caminho paralelo. O TEXTO sai do DERIVED, pelo dono unico do ASR" ;;

            # As quatro fases PAGAS do Instagram. `instagram.post.comments` esta
            # declarada e SEM rota; `bio`/`posts`/`reels` nem capacidade tem. E
            # a C10.6D nao autoriza gasto.
            bio|posts|reels|comentarios)
              recusar "${{ inputs.fase }}" COLLECTION_FETCH \
                "rota paga sem capacidade registada; esta missao nao autoriza gasto" ;;

            # ── A ÚNICA ROTA PAGA COM CAPACIDADE, ROTA E AUTORIZAÇÃO ─────
            # `youtube.native_caption` → `apify:transcricao`. A C10.8B ligou a
            # rota e provou-a offline; a C10.8B-LIVE traz a autorização humana
            # de US$0,10 para a primeira corrida real.
            #
            # Esta porta NÃO nomeia ator, NÃO escolhe alvo e NÃO declara teto.
            # Se ela precisasse de saber o ID do ator para funcionar, o motor
            # teria voltado para dentro do disparador.
            #
            #     WORKFLOW É DISPARADOR. WORKFLOW NÃO É MOTOR DE COLETA.
            #     E UM TETO QUE VIVE NO DISPARADOR É UM TETO QUE QUEM DISPARA
            #     ESCOLHE.
            yt-legenda-paga)
              PYTHONIOENCODING=utf-8 $PY coleta/social_scrap.py \
                coletar yt-legenda-paga ;;

            # ── NÃO É COLLECTION · CONTINUA COMO ESTAVA ──────────────────
            # Medido, não suposto. Nenhuma destas adquire nada de plataforma:
            # elas leem o que já está em casa, ou dizem o estado de um portão.
            #
            #   diario-fila     seleção local sobre o acervo    COLLECTION_SUPPORT
            #   diario-noticia  comparação local com ontem      OPERATIONAL_CONTROL
            #   portao-pessoal  o portão de dado pessoal        OPERATIONAL_CONTROL
            #   yt-relevancia   «vale a pena esta fonte?»       JUDGMENT
            #   yt-calibrar     calibra a mesma peneira         JUDGMENT
            #   contratos/plano lê schema e estado de chave     VALIDATION_TOOL
            #   semaforo/liquidar  controlo de execução         OPERATIONAL_CONTROL
            #
            # `yt-relevancia` é JULGAMENTO, e fica FORA da convergência de
            # propósito: empurrá-la para o SCRAP como capacidade de aquisição
            # faria o número passar e poria juízo temático dentro da coleta.
            #
            #     COLETAR != ADMITIR != JULGAR.
            yt-legenda-bruto)
              PYTHONIOENCODING=utf-8 $PY coleta/social_scrap.py bruto ;;
            diario-fila)     PYTHONIOENCODING=utf-8 $PY coleta/instagram_diario.py fila ;;
            diario-noticia)  PYTHONIOENCODING=utf-8 $PY coleta/instagram_diario.py noticia ;;
            portao-pessoal)  PYTHONIOENCODING=utf-8 $PY coleta/instagram_pessoal.py estado ;;
            yt-relevancia)   PYTHONIOENCODING=utf-8 $PY coleta/youtube_relevancia.py tudo ;;
            yt-calibrar)     PYTHONIOENCODING=utf-8 $PY coleta/youtube_relevancia.py calibrar ;;
            contratos|plano|semaforo|liquidar)
              PYTHONIOENCODING=utf-8 $PY coleta/instagram_coleta.py "${{ inputs.fase }}" ;;

            # ── O RAMO DE OMISSÃO DEIXOU DE EXISTIR ──────────────────────
            # Ele mandava QUALQUER fase não nomeada para `instagram_coleta.py`,
            # e ali dentro moravam quatro fases PAGAS. Uma porta que aceita o
            # que ninguém listou é uma porta que ninguém mediu.
            *)
              echo "FASE_DESCONHECIDA=${{ inputs.fase }}"
              echo "  Nenhum ramo a reclama. O ramo de omissao foi retirado na"
              echo "  C10.6D: ele mandava fase nao nomeada para um orquestrador"
              echo "  que tem fases pagas la dentro."
              exit 2 ;;
          esac

      # Depois de CADA fase paga, a fatura. Quem autoriza a fase seguinte precisa
      # ver o custo REAL da anterior, nao a estimativa dela.
      - name: 7 · liquidar o custo real (depois de fase paga)
        if: always() && contains(fromJSON('["bio","posts","reels","comentarios"]'), inputs.fase)
        run: PYTHONIOENCODING=utf-8 $PY coleta/instagram_coleta.py liquidar || true

      - name: 8 · devolver o resultado (só os caminhos DESTA missão)
        if: always()
        run: |
          git config user.name  "sintonia-eame-runner"
          git config user.email "runner@eame-sintonia.local"
          # Nunca `git add -A`. Outra missao pode estar gravando em data/samples/
          # no mesmo instante, e levar o arquivo dela num commit meu criaria um
          # commit que nenhuma das duas missoes fez.
          # `SCRAP-YOUTUBE` é onde uma fase PAGA deixa o REGISTO dela. O bruto
          # em si fica na máquina: `.gitignore` ignora `data/samples/**/*.gz`, e
          # forçá-lo aqui seria passar por cima de uma decisão desta casa sem a
          # discutir. O que volta é o registo, com o SHA-256 do bruto.
          #
          #     RAW CAPTURADO NO RUNNER != RAW DEVOLVIDO AO REPOSITÓRIO.
          # `REEL-TRANSCRICOES` é a gaveta do dono da cadeia do Reel
          # (`ferramentas/reel_transcricao.py::SAIDA`). Sem ela nesta lista, a
          # fase `transcricao-reel` corria e o resultado dela NÃO voltava — e o
          # registo que a casa lê depois ficava só na máquina.
          #
          #     COLETAR E NÃO DEVOLVER É PAGAR REDE POR NADA.
          for d in INSTAGRAM-JANELA INSTAGRAM-COLETA INSTAGRAM-DIARIO INSTAGRAM-TRANSCRICOES \
                   YOUTUBE-JANELA YOUTUBE-RELEVANCIA YOUTUBE-TRANSCRICOES \
                   REEL-TRANSCRICOES SCRAP-YOUTUBE; do
            git add "data/samples/$d" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "NADA_MUDOU=YES · a fase nao produziu arquivo novo"; exit 0
          fi
          if git diff --cached --name-only | grep -qvE '^data/samples/(INSTAGRAM|YOUTUBE|REEL|SCRAP)-'; then
            echo "NAMESPACE_VIOLADO=YES · ha arquivo fora dos caminhos desta missao"
            git diff --cached --name-only; exit 1
          fi
          echo "NAMESPACE_LIMPO=YES"
          echo "--- o que volta ---"; git diff --cached --stat
          git commit -q -m "sintonia scrap: fase ${{ inputs.fase }} (run ${{ github.run_id }})"
          git pull --rebase --quiet origin "${{ github.ref_name }}" || true
          git push origin HEAD:"${{ github.ref_name }}"
          echo "RESULTADO_COMMITADO=YES"

      # A bancada morre com o job, MESMO em falha: um cluster esquecido no
      # self-hosted vira estado partilhado da corrida seguinte — o _work
      # deste runner persiste entre jobs, e isso foi medido.
      - name: 9z-IT · a bancada italiana morre (always)
        if: always() && inputs.fase == 'italia-documento'
        run: |
          PGBIN="${SINTONIA_PG_PORTATIL:-$HOME/orca/pgtmp/pgsql/bin}"
          CLUSTER="$RUNNER_TEMP/pg-italia-$GITHUB_RUN_ID"
          "$PGBIN/pg_ctl.exe" -D "$CLUSTER" -w -m fast stop >/dev/null 2>&1 || true
          rm -rf "$CLUSTER" "$RUNNER_TEMP/ops-italia-$GITHUB_RUN_ID"
          echo "bancada destruida: cluster e ops-root removidos"

      - name: 9 · o que a fase gastou, e o que ela cobriu
        if: always()
        run: |
          PYTHONIOENCODING=utf-8 $PY - <<'PYEOF'
          import json, os
          BASE = os.path.join('data', 'samples')
          alvo = os.path.join(BASE, 'INSTAGRAM-COLETA', 'CUSTO-LIQUIDADO.json')
          if os.path.exists(alvo):
              with open(alvo, encoding='utf-8') as f:
                  d = json.load(f)
              print('COST_USD_LIQUIDADO=%s' % d.get('TOTAL_USD'))
              print('LIQUIDADO_EM=%s' % d.get('CAPTURED_AT'))
          else:
              print('COST_USD_LIQUIDADO=0 · nenhuma fase paga liquidada neste ref')
          sem = os.path.join(BASE, 'INSTAGRAM-COLETA', 'SEMAFORO.json')
          if os.path.exists(sem):
              with open(sem, encoding='utf-8') as f:
                  s = json.load(f)
              for a in (s.get('ALERTAS') or []):
                  print('ALERTA: %s' % a)
              print('--- semaforo (%s) ---' % s.get('CAPTURED_AT'))
              print('  %-22s %-9s %-8s %-7s %-7s %s'
                    % ('conta', 'porta', 'objetos', 'c/data', 'videos', 'pago'))
              for c in (s.get('GRADE') or []):
                  if not isinstance(c, dict):
                      continue
                  pago = ','.join(k[5:].lower() for k in
                                  ('PAGO_BIO', 'PAGO_POSTS', 'PAGO_REELS',
                                   'PAGO_COMENTARIOS')
                                  if c.get(k) not in (None, 'NAO_RODOU', False))
                  print('  %-22s %-9s %-8s %-7s %-7s %s' % (
                      str(c.get('ACCOUNT_HANDLE'))[:22], c.get('PORTA'),
                      c.get('OBJETOS_LIDOS'), c.get('COM_DATA'), c.get('VIDEOS'),
                      pago or 'NAO_RODOU'))
          PYEOF
