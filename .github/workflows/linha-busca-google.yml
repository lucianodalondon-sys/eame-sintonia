# ═══════════════════════════════════════════════════════════════════════
# LINHA-BUSCA · GOOGLE PELA API OFICIAL + PILOTO DE COMENTÁRIOS D106, NO ACTIONS
# (BUSCA-NO-ACTIONS, 27/09 — ajustado às 12:20 pela coordenação)
# ═══════════════════════════════════════════════════════════════════════
#
# O QUE FAZ, NUMA SÓ CORRIDA
# --------------------------
# 0. confere que nenhum segredo entrou no repositório (`guarda/social_guarda.py`);
# 1. lê o PEDIDO (`ferramentas/linha_busca/PEDIDO-BUSCA-GOOGLE.json`): N, só-diagnóstico, comentários, CX;
# 2. DIAGNÓSTICO da Custom Search JSON API — UMA chamada: a API está ativa neste projeto? a chave pode
#    usá-la? há CX? (`coleta/linha_busca.py --diagnosticar-cse`) → DIAGNOSTICO.json;
# 3. BUSCA de N consultas — só se o diagnóstico disser que dá E o pedido não for «só diagnóstico»;
# 4. PILOTO DE COMENTÁRIOS (D106): `commentThreads.list` nos 10 vídeos pais do
#    COMMENT-INTELLIGENCE-FASE1.md §12, order=relevance e order=time, maxResults 100, 1 página
#    (20 chamadas = 20 unidades das 10 000 do dia) → a resposta CRUA de cada uma + sha256;
# 5. resumo na página da corrida e TUDO como artifact (sempre). Nada se escreve no repositório.
#
# A entrada na Sala (e a minimização da D106: sem perfil/avatar de quem comentou, comentário =
# PUBLIC_ASSERTION) faz-se NA MÁQUINA DO COORDENADOR, pela porta canónica, a partir do artifact.
# As páginas dos resultados da busca também se colhem lá, com a VPN IT (`--colher`).
#
# O SEGREDO
# ---------
# SÓ `secrets.YOUTUBE_DATA_API_KEY`, escrito FIXO (nenhum SUPABASE_*). Um `secrets[...]` pelo nome faria o
# GitHub entregar TODOS os secrets do repositório ao runner — por isso não há. Entra só nos passos 2, 3 e 4,
# pelo ambiente, e nunca é impresso (a tesoura `api_oficial.redigir` + a máscara do Actions).
#
# COMO SE DISPARA
# ---------------
# PUSH no próprio ramo `busca-no-actions-v1` que mude este ficheiro ou o pedido. `workflow_dispatch`
# não serve: exige o ficheiro no ramo por omissão, e esse não se edita. Runner: `ubuntu-latest`
# (os self-hosted estão desligados e fazem commit — não servem para isto).
# ═══════════════════════════════════════════════════════════════════════
name: linha-busca-google

on:
  push:
    branches: [busca-no-actions-v1]
    paths:
      - '.github/workflows/linha-busca-google.yml'
      - 'ferramentas/linha_busca/PEDIDO-BUSCA-GOOGLE.json'

permissions:
  contents: read

concurrency:
  group: linha-busca-google
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 0 · nenhum segredo entrou no repositório
        run: PYTHONIOENCODING=utf-8 python3 guarda/social_guarda.py

      - name: 1 · o pedido (sem segredo nenhum)
        id: pedido
        run: PYTHONUTF8=1 python3 ferramentas/linha_busca/pedido_actions.py >> "$GITHUB_OUTPUT"

      - name: 2 · diagnóstico da Custom Search (1 chamada)
        id: diag
        continue-on-error: true
        env:
          SINTONIA_GOOGLE_CSE_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          SINTONIA_GOOGLE_CSE_CX: ${{ steps.pedido.outputs.cx }}
          PYTHONUTF8: '1'
        run: python3 coleta/linha_busca.py --diagnosticar-cse --autorizado --sem-portao-it --saida=saida

      - name: 3 · busca (N consultas pela API oficial)
        if: steps.diag.outcome == 'success' && steps.pedido.outputs.so_diagnostico != 'true'
        env:
          SINTONIA_GOOGLE_CSE_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          SINTONIA_GOOGLE_CSE_CX: ${{ steps.pedido.outputs.cx }}
          N: ${{ steps.pedido.outputs.n }}
          PYTHONUTF8: '1'
        run: >-
          python3 coleta/linha_busca.py --buscar --autorizado --sem-portao-it --motor=GOOGLE_CSE
          --consultas=data/derivados/LINHA-BUSCA/CONSULTAS.json --n="$N" --saida=saida

      - name: 4 · piloto de comentários D106 (20 chamadas commentThreads.list)
        id: coment
        if: steps.pedido.outputs.comentarios == 'true'
        continue-on-error: true
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          PYTHONUTF8: '1'
        run: python3 ferramentas/linha_busca/comentarios_piloto_d106.py --saida=saida

      - name: 5 · o relatório na página da corrida
        if: always()
        run: PYTHONUTF8=1 python3 ferramentas/linha_busca/pedido_actions.py --resumo=saida >> "$GITHUB_STEP_SUMMARY"

      - name: 6 · publicar tudo como artifact (diagnóstico, resultados, comentários crus + sha256)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linha-busca-google-${{ github.run_id }}
          path: saida/
          if-no-files-found: warn
          # a resposta crua dos comentários traz nome/canal de quem comentou: o artifact vive pouco
          retention-days: 7

      - name: 7 · a corrida fica vermelha se o piloto de comentários falhou (o artifact já saiu)
        if: steps.coment.outcome == 'failure'
        run: |
          echo "PILOTO_D106_FALHOU: ver COMENTARIOS-PILOTO-D106.json no artifact"
          exit 1
