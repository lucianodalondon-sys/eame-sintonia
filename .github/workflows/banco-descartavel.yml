# ═══════════════════════════════════════════════════════════════════════
# A GARANTIA FORWARD, CONTRA POSTGRES DE VERDADE
#
# A bateria local prova a reconciliacao contra um banco real — mas SQLite.
# As travas que interessam sao as mesmas; o motor nao e. Dizer «provado no
# banco» sem dizer QUAL seria esconder metade da frase.
#
# Aqui a migration 001 ORIGINAL e aplicada num Postgres 16 que nasce e morre
# dentro deste job — enum `run_status` incluido, que o SQLite teve de traduzir
# para um CHECK.
#
#   SQL ACEITE          nao e  LINHA GRAVADA
#   TESTE COM SIMULACRO nao e  RECONCILIACAO DE BANCO
#   COMPLETE NO PYTHON  nao e  CONCLUIDA NO POSTGRES
#
# NADA AQUI TOCA PRODUCAO. Este workflow nao le nenhum segredo do Supabase, e
# a propria prova recusa-se a arrancar se o endereco do banco nao for
# visivelmente local.
# ═══════════════════════════════════════════════════════════════════════
name: banco-descartavel

on:
  push:
    paths:
      - 'guarda/preservar_coleta.py'
      - 'guarda/memoria_descartavel.py'
      - 'provas/preservar_coleta_no_postgres.py'
      - 'supabase/migrations/001_*.sql'
      - 'supabase/migrations/022_*.sql'
      - 'supabase/migrations/023_*.sql'
      - 'provas/derived_artifact_no_postgres.py'
      - '.github/workflows/banco-descartavel.yml'
  workflow_dispatch:

jobs:
  postgres-descartavel:
    runs-on: ubuntu-latest

    # O contentor morre com o job. Nao ha volume, nao ha persistencia, e a
    # senha e visivel de proposito: nao ha nada la dentro para proteger.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: descartavel
          POSTGRES_DB: descartavel
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # `psql` ja existe no runner. Nao se instala pacote global so para um
      # teste passar — a prova fala com o banco pelo cliente que ja la esta.
      - name: 1 · o cliente do banco existe, e o banco responde
        run: |
          psql --version
          psql "$BANCO_DESCARTAVEL_URL" -c 'select version();'
        env:
          BANCO_DESCARTAVEL_URL: postgresql://postgres:descartavel@localhost:5432/descartavel

      - name: 2 · a mesma garantia, contra Postgres 16 real (schema da fundação)
        run: python3 provas/preservar_coleta_no_postgres.py
        env:
          BANCO_DESCARTAVEL_URL: postgresql://postgres:descartavel@localhost:5432/descartavel

      # A casa do derivado: a migration 022 tem de APLICAR num Postgres real, e
      # as travas dela tem de morder. DESIGNED nao e DB_TESTED, e a distancia
      # entre os dois ja custou uma promocao prematura nesta casa.
      #
      # Banco proprio (`derivado`), para nao herdar as linhas da prova anterior:
      # um caso que passa por causa do estado deixado por outro nao prova nada.
      - name: 2b · a casa do derivado aplica e as travas mordem
        run: |
          psql "$ADMIN_URL" -c 'create database derivado;'
          python3 provas/derived_artifact_no_postgres.py
        env:
          ADMIN_URL: postgresql://postgres:descartavel@localhost:5432/descartavel
          BANCO_DESCARTAVEL_URL: postgresql://postgres:descartavel@localhost:5432/derivado

      # O contrato de persistencia social: a 023 tem de APLICAR num Postgres
      # real, e as duas travas dela tem de morder — a identidade da ocorrencia
      # e o parentesco da thread. Reproduzido antes de existir: dois «Grazie!»
      # com IDs diferentes davam 1 linha no banco, e uma resposta perdia o pai
      # ao entrar na camada estruturada.
      #
      #     COMMENT_ID NAO E COMMENT_TEXT.
      #     REPLY NAO E TOP-LEVEL.
      #
      # Banco proprio (`social`), para nao herdar linhas das provas anteriores:
      # um caso que passa por causa do estado deixado por outro nao prova nada.
      #
      # `if: always()` pelo MESMO motivo que o passo 3 ja o usa nesta casa: se um
      # passo anterior rebentar, esta prova e justamente o que continua tendo de
      # ser conferido. Medido em 2026-09-08: o passo 2b reprova neste ramo por
      # divergencia de base — as mesmas 4 reprovacoes aparecem em b38312f8, ANTES
      # desta missao, e o conserto vive em `claude/italia-biblia-integracao-v1`
      # (9b4dc299), que este ramo ainda nao recebeu. Sem `always()`, uma falha
      # herdada de outra peca esconderia o resultado desta — e prova pulada nao
      # e prova.
      - name: 2c · o contrato de persistencia social aplica e as travas mordem
        if: always()
        run: |
          psql "$ADMIN_URL" -c 'create database social;'
          python3 provas/social_persistencia_no_postgres.py
        env:
          ADMIN_URL: postgresql://postgres:descartavel@localhost:5432/descartavel
          BANCO_DESCARTAVEL_URL: postgresql://postgres:descartavel@localhost:5432/social

      # A prova de que a trava contra o acidente e real: apontada para fora,
      # ela tem de RECUSAR-SE a correr.
      #
      # `if: always()` NAO e conforto. Se o passo 2 rebentar — e ja rebentou —
      # a trava de seguranca e JUSTAMENTE o que continua a ter de ser conferido.
      # Uma tranca que so se testa quando esta tudo bem nao e uma tranca.
      - name: 3 · a prova recusa-se a correr fora de um banco descartável
        if: always()
        run: |
          falhou=0
          testar() {
            if BANCO_DESCARTAVEL_URL="$1" python3 provas/preservar_coleta_no_postgres.py; then
              echo "FALHOU: aceitou $1"; falhou=1
            else
              echo "OK  recusou: $1"
            fi
          }
          # host remoto
          testar "postgresql://alguem@db.exemplo-remoto.com:5432/producao"
          # host que so CONTEM a palavra localhost
          testar "postgresql://alguem@localhost.atacante.example:5432/descartavel"
          # host local, mas banco que nao e o descartavel
          testar "postgresql://alguem@localhost:5432/producao"
          # host chamado `db`, que a versao anterior aceitava por substring
          testar "postgresql://alguem@db:5432/descartavel"
          exit $falhou
