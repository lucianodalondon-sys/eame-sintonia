# ═══════════════════════════════════════════════════════════════════════
# COMUNICAÇÃO PÚBLICA DO CONCORRENTE — coleta por fase, no runner local.
#
# Uma fase por execução, escolhida na mão. `contratos` é GRÁTIS e roda
# primeiro: ele faz um GET no ator e prova que o ator EXISTE com aquele
# identificador antes de qualquer execução paga.
#
#     contratos    GRÁTIS — lê o ator. Zero run, zero item, zero custo.
#     posts        posts das contas AUTORIZADAS de uma plataforma
#
# Três dos quatro identificadores de ator desta missão nunca foram
# executados por esta casa. Rodar `posts` antes de `contratos` passar é
# repetir o erro mais caro já medido aqui: o piloto italiano queimou 8
# execuções pagas mandando um campo que o Actor descartava em silêncio, e
# os 8 runs devolveram o mesmo consultor de cibersegurança.
#
#     ENTRADA ERRADA != PLATAFORMA ERRADA.
#
# O QUE ESTE WORKFLOW NÃO DECIDE
# -------------------------------
# Quem entra na coleta já está decidido em `CONTAS-V1.json`, resolvido de
# graça, fora daqui. A fase paga só LÊ aquela lista e só aceita linha com
# COLLECTION_AUTHORIZED = YES — que significa PROVED **e** LOCAL_COUNTRY.
# Nenhum passo abaixo promove conta.
#
# O SEGREDO NÃO SAI DAQUI
# ------------------------
# `APIFY_TOKEN_POOL` entra por secret e vive só no cabeçalho Authorization.
# `apify_pool.redigir()` limpa qualquer texto de erro antes do log, porque um
# traceback de urllib carrega a URL e a URL pode carregar o token.
# ═══════════════════════════════════════════════════════════════════════
name: comunicacao-publica

on:
  workflow_dispatch:
    inputs:
      fase:
        description: 'qual fase rodar'
        required: true
        default: contratos
        type: choice
        options: [contratos, posts]
      plataforma:
        description: 'só para a fase posts'
        required: true
        default: YOUTUBE
        type: choice
        options: [YOUTUBE, INSTAGRAM, FACEBOOK, LINKEDIN]

permissions:
  contents: write

jobs:
  coleta:
    # Runner local, e não ubuntu-latest, pela mesma medição que já mandou nas
    # outras missões: o IP de contêiner leva 429 e 403 onde a máquina
    # residencial passa.
    runs-on: [self-hosted, Windows, X64, eame-sintonia-local-2]
    defaults:
      run:
        shell: bash
    env:
      APIFY_TOKEN_POOL: ${{ secrets.APIFY_TOKEN_POOL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      # RUNNER PERSISTENTE != ÁRVORE LIMPA. `actions/checkout` limpa arquivo
      # não rastreado; não desfaz commit local preso de uma rodada que morreu
      # no meio de um rebase.
      - name: 0a · base limpa antes de qualquer coleta
        run: |
          git rebase --abort 2>/dev/null || true
          git merge --abort 2>/dev/null || true
          git fetch --quiet origin "${{ github.ref_name }}"
          git reset --hard --quiet "origin/${{ github.ref_name }}"
          echo "BASE=$(git log --oneline -1)"

      # `python3` nesta máquina é o atalho da Microsoft Store e falha. `py` funciona.
      - name: 0 · interpretador
        run: |
          for c in py python3 python; do
            if $c --version >/dev/null 2>&1; then
              echo "PY=$c" >> "$GITHUB_ENV"; echo "INTERPRETADOR=$c"; exit 0
            fi
          done
          echo "INTERPRETADOR=NENHUM"; exit 1

      - name: 1 · censo do pool (presença e quantidade — nunca valor)
        run: PYTHONIOENCODING=utf-8 $PY scripts/apify_pool.py

      # A régua de identidade roda de novo, de graça, ANTES da fase paga. Ela é
      # determinística sobre a evidência gravada: se o resultado mudar aqui,
      # alguém mexeu na régua ou na evidência, e a coleta tem que ver a lista nova.
      # A régua roda de novo, de graça, e os testes junto. Mas o LOTE **não** é
      # regenerado aqui: ele está congelado, e regerar destruiria o denominador contra o
      # qual o rendimento vai ser medido. Se a régua e o lote divergirem, o passo abaixo
      # AVISA e a coleta segue obedecendo ao lote — a divergência aparece no git diff e é
      # decisão humana, não conserto silencioso de máquina.
      - name: 2 · reconferir a régua e os testes (grátis, não regera o lote)
        run: |
          PYTHONIOENCODING=utf-8 $PY scripts/comunicacao_identidade.py
          PYTHONIOENCODING=utf-8 $PY tests/test_comunicacao.py
          PYTHONIOENCODING=utf-8 $PY - <<'PYEOF'
          import json
          lote = json.load(open('data/samples/COMPETITOR-PUBLIC-COMM/'
                                'PUBLIC-COMM-FIRST-BATCH-EAME.json', encoding='utf-8'))
          contas = json.load(open('data/samples/COMPETITOR-PUBLIC-COMM/CONTAS-V1.json',
                                  encoding='utf-8'))
          no_lote = {c['ACCOUNT_URL'] for c in lote['ACCOUNTS']}
          pela_regua = {c['ACCOUNT_URL'] for c in contas['ACCOUNTS']
                        if c['COLLECTION_AUTHORIZED'] == 'YES'}
          print('LOTE_CONGELADO_EM=%s' % lote['FROZEN_AT'])
          print('CONTAS_NO_LOTE=%d' % len(no_lote))
          if no_lote == pela_regua:
              print('LOTE_x_REGUA=IGUAIS')
          else:
              print('LOTE_x_REGUA=DIVERGEM — a coleta obedece ao LOTE')
              for u in sorted(pela_regua - no_lote):
                  print('  a regua liberou e o lote NAO tem: %s' % u)
              for u in sorted(no_lote - pela_regua):
                  print('  o lote tem e a regua NAO libera mais: %s' % u)
          PYEOF

      - name: 3 · rodar a fase
        env:
          RUNNER_NAME: ${{ runner.name }}
        run: |
          echo "FASE=${{ inputs.fase }} · PLATAFORMA=${{ inputs.plataforma }}"
          if [ "${{ inputs.fase }}" = "contratos" ]; then
            PYTHONIOENCODING=utf-8 $PY scripts/comunicacao_coleta.py contratos
          else
            PYTHONIOENCODING=utf-8 $PY scripts/comunicacao_coleta.py posts \
              "${{ inputs.plataforma }}"
          fi

      # ⚠️ AQUI HAVIA `|| true` NAS DUAS LINHAS, E O PASSO 5 COMMITAVA A SEGUIR.
      # O efeito era exatamente o padrao que a missao da trilha universal manda
      # eliminar: classificar falha, medir falha, e o resultado entra no
      # repositorio como se estivesse valido — porque ninguem viu a falha.
      #
      #     `|| true` NAO TORNA O PASSO OPCIONAL. TORNA A FALHA INVISIVEL.
      #
      # A distincao que faltava e entre COLETAR e CONCLUIR. O material bruto que
      # a fase 3 trouxe DEVE ser preservado mesmo que a inteligencia falhe —
      # jogar coleta fora e irreversivel, e o acervo pode guardar o que ainda nao
      # foi lido. O que NAO pode e a conclusao sair como se a leitura tivesse
      # acontecido.
      #
      # Entao: a inteligencia roda, a falha e REGISTRADA num marcador que viaja
      # junto com o commit, e o passo 5 continua devolvendo o bruto — mas
      # gritando. O job termina VERMELHO ao final, depois de o dado estar salvo.
      - name: 4 · classificar e medir (grátis, sobre o que acabou de chegar)
        if: always()
        run: |
          set +e
          PYTHONIOENCODING=utf-8 $PY scripts/comunicacao_classificar.py
          rc_cls=$?
          PYTHONIOENCODING=utf-8 $PY scripts/comunicacao_medir.py
          rc_med=$?
          set -e
          echo "CLASSIFICAR_RC=$rc_cls · MEDIR_RC=$rc_med"
          if [ "$rc_cls" != 0 ] || [ "$rc_med" != 0 ]; then
            mkdir -p data/samples/COMPETITOR-PUBLIC-COMM
            $PY - "$rc_cls" "$rc_med" <<'PYEOF'
          import json, os, sys
          json.dump({
            "ESTADO": "VALIDATION_REQUIRED",
            "LEI": "DADO BRUTO NAO E PUBLICAVEL. A coleta desta rodada esta "
                   "preservada no acervo; a inteligencia sobre ela FALHOU e a "
                   "conclusao NAO pode ser apresentada como valida.",
            "CLASSIFICAR_RC": int(sys.argv[1]),
            "MEDIR_RC": int(sys.argv[2]),
            "RUN_ID": os.environ.get("GITHUB_RUN_ID"),
            "O_QUE_FAZER": "rodar scripts/comunicacao_classificar.py e "
                           "scripts/comunicacao_medir.py, consertar a causa e "
                           "remover este marcador. Enquanto ele existir, o lote "
                           "desta rodada esta em VALIDATION_REQUIRED.",
          }, open("data/samples/COMPETITOR-PUBLIC-COMM/"
                  "INTELIGENCIA-FALHOU.json", "w", encoding="utf-8"),
             ensure_ascii=False, indent=1)
          PYEOF
            echo "INTELIGENCIA=FALHOU · marcador gravado; o bruto sera commitado e o job falha ao final"
            echo "INTELIGENCIA_FALHOU=1" >> "$GITHUB_ENV"
          else
            rm -f data/samples/COMPETITOR-PUBLIC-COMM/INTELIGENCIA-FALHOU.json
            echo "INTELIGENCIA=OK"
          fi

      - name: 5 · devolver o resultado ao repositório
        run: |
          set -e
          git config user.name  "sintonia-eame-runner"
          git config user.email "runner@eame-sintonia.local"
          git add -A "data/samples/COMPETITOR-PUBLIC-COMM" "data/samples/raw-paid" || true
          if git diff --cached --quiet; then
            echo "NADA_MUDOU=YES · a fase nao produziu arquivo novo"; exit 0
          fi
          echo "--- o que volta ---"; git diff --cached --stat
          git commit -q -m "comunicacao publica: fase ${{ inputs.fase }} ${{ inputs.plataforma }} (run ${{ github.run_id }})"
          # Outra sessao pode ter empurrado enquanto a fase rodava. Se o rebase
          # conflitar, ABORTA e falha ALTO — nunca imprime sucesso com o dado preso
          # na maquina.
          for tentativa in 1 2 3; do
            git fetch --quiet origin "${{ github.ref_name }}"
            if git rebase --quiet "origin/${{ github.ref_name }}"; then
              if git push --quiet origin HEAD:"${{ github.ref_name }}"; then
                echo "RESULTADO_COMMITADO=YES (tentativa $tentativa)"; exit 0
              fi
              echo "push recusado, outra sessao chegou antes — tentando de novo"
            else
              echo "CONFLITO no rebase, abortando (tentativa $tentativa)"
              git rebase --abort || true
            fi
            sleep $((tentativa * 5))
          done
          echo "RESULTADO_COMMITADO=NO · nao consegui devolver o resultado"
          exit 1

      # O bruto ja esta salvo e empurrado. AGORA a falha da inteligencia derruba
      # o job — nesta ordem, e nao antes: falhar cedo perderia a coleta paga.
      - name: 6 · a falha da inteligência é visível
        if: always()
        run: |
          if [ "${INTELIGENCIA_FALHOU:-0}" = "1" ]; then
            echo "PARADO: a classificacao ou a medicao falhou nesta rodada."
            echo "O material bruto foi preservado e commitado."
            echo "O lote esta em VALIDATION_REQUIRED — ver"
            echo "data/samples/COMPETITOR-PUBLIC-COMM/INTELIGENCIA-FALHOU.json"
            exit 1
          fi
          echo "INTELIGENCIA=OK · nada a sinalizar"
