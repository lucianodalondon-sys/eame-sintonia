# PROVA PEQUENA da rota de busca de perfil por NOME — e, antes dela, a leitura
# gratuita do contrato de entrada dos Actors.
#
# Existe por causa dos 8 runs perdidos: o Actor anterior recebeu um campo que
# não lê, ignorou-o em silêncio e devolveu o mesmo perfil oito vezes.
# WRONG_INPUT_CONTRACT ≠ WRONG_PLATFORM.
#
# `so_contrato: true` é o padrão de propósito: o primeiro disparo NÃO gasta
# nada — só lê o `inputSchema` publicado de cada Actor, que é GET gratuito.
# Só depois de ver os campos reais é que se autoriza a prova de dois nomes.
#
# workflow_dispatch apenas. Sem cron. Coleta paga nunca acontece por relógio.
name: linkedin-prova-busca

on:
  workflow_dispatch:
    inputs:
      so_contrato:
        description: 'so ler o contrato dos Actors (gratuito, nao gasta nada)'
        type: boolean
        default: true
      todos_os_oito:
        description: 'medir os 8 alvos da missao em vez dos 2 da prova'
        type: boolean
        default: false
      reler_raw_do_run:
        description: 'id do run cujo RAW deve ser relido (gratuito, zero execucao)'
        type: string
        default: ''

permissions:
  contents: read
  actions: read      # so para baixar o RAW ja pago de um run anterior

jobs:
  provar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Mascara cada chave INDIVIDUALMENTE. Sem isto o Actions só mascara o
      # valor inteiro da secret, e uma chave sozinha num traceback sairia em claro.
      - name: mascarar cada chave do pool
        env:
          APIFY_TOKEN_POOL: ${{ secrets.APIFY_TOKEN_POOL }}
        run: |
          python3 - <<'PY' > /tmp/mask.txt
          import os, re
          v = os.environ.get('APIFY_TOKEN_POOL', '')
          for k in re.split(r'[,;\s]+', v):
              if k.strip():
                  print(k.strip())
          PY
          while IFS= read -r k; do
            [ -n "$k" ] && echo "::add-mask::$k"
          done < /tmp/mask.txt
          rm -f /tmp/mask.txt
          echo "mascaramento aplicado"

      - name: provas locais (nenhuma toca a rede)
        run: |
          python3 -m unittest tests.test_apify_contrato tests.test_linkedin_prova_busca -v 2>&1 | tail -30

      - name: contrato de entrada dos Actors (GET gratuito, zero run)
        env:
          APIFY_TOKEN_POOL: ${{ secrets.APIFY_TOKEN_POOL }}
        run: python3 scripts/apify_contrato.py

      # Corrigir o MEU parser nao pode custar dinheiro de novo. O bruto de um run
      # anterior volta pelo artefato e a leitura e refeita com ZERO execucoes.
      - name: baixar o RAW ja pago
        if: ${{ inputs.reler_raw_do_run != '' }}
        uses: actions/download-artifact@v4
        with:
          # Sem `name`: baixa TODOS os artefatos daquele run e funde. O run 3 subiu
          # sob o nome antigo, e exigir o nome novo faria a releitura falhar por
          # causa de uma renomeacao minha — nao por falta do bruto.
          run-id: ${{ inputs.reler_raw_do_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: data/samples

      - name: reler o RAW ja pago (zero execucao, zero custo)
        if: ${{ inputs.reler_raw_do_run != '' }}
        run: python3 scripts/linkedin_prova_busca.py --reler-raw

      - name: busca por nome
        if: ${{ inputs.so_contrato == false && inputs.reler_raw_do_run == '' }}
        env:
          APIFY_TOKEN_POOL: ${{ secrets.APIFY_TOKEN_POOL }}
        run: |
          python3 scripts/linkedin_prova_busca.py \
            ${{ inputs.todos_os_oito && '--todos' || '' }}

      - name: nenhum token nos artefatos
        if: ${{ always() }}
        run: |
          for f in data/samples/IT-CASOS/IT-APIFY-CONTRATO.json \
                   data/samples/IT-CASOS/IT-LINKEDIN-PROVA-BUSCA.json; do
            [ -f "$f" ] || continue
            if grep -qE 'apify_api_[A-Za-z0-9]{10,}' "$f"; then
              echo "ABORTADO: token no artefato $f"; exit 1
            fi
          done
          echo "sem token nos artefatos"

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          # Nome por run: um artefato fixo faria a releitura de amanha baixar o
          # bruto de hoje pensando que era o de ontem.
          name: linkedin-prova-busca-${{ github.run_id }}
          path: |
            data/samples/IT-CASOS/IT-APIFY-CONTRATO.json
            data/samples/IT-CASOS/IT-LINKEDIN-PROVA-BUSCA.json
            data/samples/raw-paid/
          if-no-files-found: ignore
