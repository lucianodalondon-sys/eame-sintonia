# ═══════════════════════════════════════════════════════════════════════
# AS FICHAS OFICIAIS PARA O STORAGE — e as DUAS PORTAS antes de escrever.
#
# ⚠️ ESTE FICHEIRO CORRIA AO SER GUARDADO, E ESCREVIA EM PRODUCAO.
# O gatilho era `push: { paths: [este ficheiro] }`: pô-lo no Git executava-o,
# contra o Supabase que os `secrets` apontassem, sem ninguem carregar em nada.
#
#     UM FICHEIRO QUE CORRE AO SER GUARDADO NAO E UMA ESTEIRA: E UM GATILHO.
#
# O `push` saiu. Fica `workflow_dispatch` e mais nada — nem `schedule`.
#
# Duas portas antes da primeira escrita, e sao diferentes:
#
#     HUMANO AUTORIZOU   `confirmar` com a palavra exacta.
#     ALVO FOI PROVADO   `SAME_PROJECT_CONFIRMED`, o mecanismo do
#                        `supabase-storage.yml`, lido de la e nao inventado.
#
# ⚠️ O QUE A SEGUNDA PORTA **NAO** PROVA: ela compara o projeto do
# `SUPABASE_URL` com o do `SUPABASE_DB_URL`. Apanha a incoerencia — Storage num
# projeto, banco noutro. NAO prova que o projeto seja descartavel. Se os dois
# segredos apontarem para producao, concordam, e a porta abre.
#
#     COERENCIA DO ALVO != ALVO SEGURO.
#
# As duas falham FECHADO: `exit 1` / `SystemExit(1)`, nunca aviso-e-segue.
# ═══════════════════════════════════════════════════════════════════════
name: supabase-fichas-adama
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'ESCREVE em Storage e Postgres. Escolhe a palavra para confirmar.'
        required: true
        default: 'NAO'
        type: choice
        options: ['NAO', 'ESCREVER_NO_SUPABASE_CONFIRMADO']
permissions: { contents: read }
jobs:
  fichas:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_DB_URL:     ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      # ── PORTA 1 · O HUMANO AUTORIZOU ──────────────────────────────────
      - name: 0a · portao humano
        env:
          CONFIRMAR: ${{ inputs.confirmar }}
        run: |
          set -e
          echo "CONFIRMACAO_RECEBIDA=$CONFIRMAR"
          if [ "$CONFIRMAR" != "ESCREVER_NO_SUPABASE_CONFIRMADO" ]; then
            echo "RECUSADO: este workflow ESCREVE em Storage e Postgres."
            echo "Para correr, escolhe 'ESCREVER_NO_SUPABASE_CONFIRMADO' em \`confirmar\`."
            exit 1
          fi
          echo "HUMAN_CONFIRMATION=PASS"

      # ── PORTA 2 · O ALVO FOI PROVADO ──────────────────────────────────
      - name: 0b · portao do alvo · SAME_PROJECT_CONFIRMED
        run: |
          set -e
          api=$(curl -sS -o /dev/null -w '%{http_code}' -m 40 \
                -H "apikey: $SUPABASE_SECRET_KEY" -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
                "$SUPABASE_URL/rest/v1/")
          echo "SUPABASE_API_CONNECTION=$([ "$api" = 200 ] && echo PASS || echo FAIL)"
          st=$(curl -sS -o /dev/null -w '%{http_code}' -m 40 \
               -H "apikey: $SUPABASE_SECRET_KEY" -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
               "$SUPABASE_URL/storage/v1/bucket")
          echo "SUPABASE_STORAGE_CONNECTION=$([ "$st" = 200 ] && echo PASS || echo FAIL)"
          [ "$api" = 200 ] && [ "$st" = 200 ] || exit 1
          python3 - <<'PY'
          import os, re, urllib.parse as U
          a = U.urlparse(os.environ['SUPABASE_URL']).hostname or ''
          ra = a.split('.')[0] if a.endswith('supabase.co') else ''
          d = U.urlparse(os.environ['SUPABASE_DB_URL'])
          h, u = (d.hostname or ''), (d.username or '')
          m = re.match(r'db\.([a-z0-9]+)\.supabase\.', h)
          rd = m.group(1) if m else (u.split('.', 1)[1] if '.' in u else '')
          print('SAME_PROJECT_CONFIRMED=' + ('YES' if ra and rd and ra == rd else 'NO'))
          raise SystemExit(0 if (ra and rd and ra == rd) else 1)
          PY

      - name: fichas oficiais MAPA -> Storage -> raw_asset (execucao NOVA, hora real)
        run: |
          python3 - <<'PY'
          import os,sys,json,hashlib,subprocess,datetime,urllib.request,urllib.error
          sys.path.insert(0, '.'); import _gavetas; import mapa_regfi as m
          URL,KEY=os.environ['SUPABASE_URL'].rstrip('/'),os.environ['SUPABASE_SECRET_KEY']
          DB=os.environ['SUPABASE_DB_URL']; H={'apikey':KEY,'Authorization':'Bearer '+KEY}
          def agora(): return datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat()
          def psql(s):
              r=subprocess.run(['psql',DB,'-tAc',s],capture_output=True,text=True)
              if r.returncode: raise SystemExit('psql: '+r.stderr[:200].replace(DB,'<OMITIDO>'))
              return r.stdout.strip()
          def http(mth,p,data=None,ct=None):
              rq=urllib.request.Request(URL+p,data=data,method=mth,
                 headers={**H,**({'Content-Type':ct} if ct else {})})
              try:
                  with urllib.request.urlopen(rq,timeout=180) as r: return r.status,r.read()
              except urllib.error.HTTPError as e: return e.code,e.read()

          RUN='ES-T4-005-FICHAS-ADAMA-%s-a'%datetime.date.today().isoformat()
          started=agora()
          rows,ts=m.export()                       # timestamp do servidor MAPA = SOURCE_VERSION
          vig=[r for r in rows if 'ADAMA' in (r.get('Titular') or '').upper() and r['Estado']=='Vigente']
          print('ALVO=%d fichas vigentes | SOURCE_VERSION=%s'%(len(vig),ts))

          # O run ABRE aqui, com started_at real e status 'rodando'. raw_asset tem FK para
          # collection_run: inserir o run so no fim era impossivel, e a FK barrou — o schema
          # agiu certo. Abrir antes tambem e mais honesto: a execucao COMECOU antes de existir
          # asset, e 'rodando' -> 'concluida' e exatamente para isso que o enum existe.
          psql("""insert into collection_run(run_id,platform,actor,actor_version,input,query,mission,
                  source_country,started_at,item_count_raw,status,capture_method,source_version,rule_version)
                  values ('%s','MAPA_ROPF','scripts/mapa_regfi.ficha_pdf','regfiweb',
                  '{"filtro":"Titular ADAMA, Estado Vigente"}'::jsonb,'fichas oficiais ADAMA vigentes',
                  '11C-ES','ES','%s',0,'rodando',
                  'GET /Productos/ExportFichaProductoPdfGet por idProducto','%s','M11C-2026-08-29')
                  on conflict (run_id) do nothing"""%(RUN,started,ts))

          up=ptr=0; falhas=[]; assets=[]
          for k,r in enumerate(vig,1):
              reg=r['NumRegistro'].replace('/','_')
              try:
                  p='/tmp/%s.pdf'%reg; m.ficha_pdf(r['IdProducto'],p); b=open(p,'rb').read()
              except Exception as e:
                  falhas.append('download %s: %s'%(reg,type(e).__name__)); continue
              if not b.startswith(b'%PDF'):
                  falhas.append('%s nao e PDF'%reg); continue
              cap=agora(); sha=hashlib.sha256(b).hexdigest()
              path='ES/mapa-ropf/%s/%s.pdf'%(reg,reg)
              st,body=http('POST','/storage/v1/object/raw/'+path,b,'application/pdf')
              if st in (200,201) or b'already exists' in body or b'Duplicate' in body: up+=1
              else: falhas.append('upload %s -> %s'%(reg,st)); continue
              psql("""insert into raw_asset(run_id,storage_path,media_type,bytes,sha256,captured_at,source_url)
                      values ('%s','%s','application/pdf',%d,'%s','%s','%s')
                      on conflict (storage_path) do nothing"""%(RUN,path,len(b),sha,cap,
                      'https://servicio.mapa.gob.es/regfiweb/Productos/ExportFichaProductoPdfGet?idProducto=%s'%r['IdProducto']))
              assets.append((path,sha,len(b)))
              if k%16==0: print('  %d/%d'%(k,len(vig)),flush=True)

          # fecha o run com a hora medida e o desfecho real
          psql("""update collection_run set finished_at='%s', item_count_raw=%d, status='%s'
                  where run_id='%s'"""%(agora(),len(assets),
                  'concluida' if assets and not falhas else ('parcial' if assets else 'vazia'),RUN))

          # verificacao: baixa TODOS de volta e recompara
          ver=0
          for path,sha,n in assets:
              st,back=http('GET','/storage/v1/object/raw/'+path)
              g=psql("select sha256||'|'||bytes from raw_asset where storage_path='%s'"%path)
              if st==200 and hashlib.sha256(back).hexdigest()==sha and g=='%s|%d'%(sha,n): ver+=1
              else: falhas.append('verificacao %s'%path)
          print('OFFICIAL_PDF_STORAGE=%d/%d'%(up,len(vig)))
          print('RAW_ASSET_POINTER=%d/%d'%(len(assets),len(vig)))
          print('PDF_HASH_VERIFIED=%d/%d'%(ver,len(assets)))
          print('ORPHANS='+psql("select count(*) from raw_asset ra left join collection_run r on r.run_id=ra.run_id where r.run_id is null"))
          print('ROWS_RAW_ASSET='+psql("select count(*) from raw_asset"))
          print('RUN_ID=%s'%RUN)
          for x in falhas[:8]: print('FALHA:',x)
          raise SystemExit(1 if (falhas or ver!=len(assets)) else 0)
          PY
